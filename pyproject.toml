[project]
name = "green-agent"
version = "5.0.0"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "cryptography>=41.0.0",
    "joblib>=1.3.0",
    "networkx>=3.1",
    "pandas>=2.0.0",
    "prometheus-client>=0.17.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.8.0",
    "scikit-learn>=1.3.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
