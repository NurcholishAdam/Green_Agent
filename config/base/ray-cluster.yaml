# config/base/ray-cluster.yaml
#
# Green Agent v5.0.0 — RayCluster
# ================================
#
# | Field | Value |
# |---|---|
# | Version | 5.0.0 |
# | Last Updated | 2026-11-13 |
# | Status | Production Ready |
# | Companion docs | `config/base/{namespace,configmap,deployment,service,serviceaccount,networkpolicy,hpa}.yaml` (v5.0.0), `green_agent.yaml` (v5.0.0), `SYMBOLIC_OVERSIGHT_README.md` (v1.2.0), `Scripts and Utilities.md` (v1.2.0) |
#
# ── Head vs Worker split ──────────────────────────────────────────────────
#   • Head  → runs GCS, Ray API server, dashboard, and the driver.
#             `num-cpus: '0'` so the head is orchestration-only — user
#             tasks are scheduled on workers, not the head.
#   • Worker → runs the actual task processes.
#             `num-cpus: '1'` aligned with `resources.limits.cpu: "1"`.
#
# ── Image parity ──────────────────────────────────────────────────────────
#   Head and workers MUST run the SAME image tag. Mixing tags breaks the
#   Ray cluster join (GCS version check). Kustomize `images:` overrides
#   `newTag` for both via the `green-agent` name below — never set a
#   different tag on the worker group.
#
# ── Autoscaling ───────────────────────────────────────────────────────────
#   RayCluster is autoscaled by Ray's in-tree autoscaler
#   (spec.enableInTreeAutoscaling + autoscalerOptions), NOT by an HPA.
#   The HPA in `config/base/hpa.yaml` targets the Deployment (HTTP head),
#   never a RayCluster.
#
# ── Probes ────────────────────────────────────────────────────────────────
#   Only `/health` exists (matches Deployment v5.0). `/ready` does not
#   exist and will 404 — using it as a readiness probe prevents the head
#   from ever becoming Ready, blocking worker joins.
#
# ── Dashboard host ────────────────────────────────────────────────────────
#   `dashboard-host: '0.0.0.0'` binds the Ray dashboard to all pod
#   interfaces. Combined with the internal-only NetworkPolicy this is safe,
#   but if the NetworkPolicy is loosened (e.g. 8265 from any namespace),
#   the dashboard becomes public. Prefer `'127.0.0.1'` and port-forward
#   for admin access:
#       kubectl port-forward -n green-agent svc/green-agent-cluster-head-svc 8265
#
# ── KubeRay version ───────────────────────────────────────────────────────
#   `apiVersion: ray.io/v1` requires KubeRay ≥ 1.0. Earlier operators use
#   `ray.io/v1alpha1`. Verify the operator version before applying:
#       kubectl get crd rayclusters.ray.io -o jsonpath='{.spec.versions[*].name}'
#
# ── Companion resources ───────────────────────────────────────────────────
#   • ServiceAccount   green-agent     (referenced below)
#   • ConfigMap        green-agent-config  (files mounted at /app/config)
#   • Secret           green-agent-secrets (envFrom)
#   • NetworkPolicy    green-agent-network-policy (allow-list ports 10001/10002)
#
# ── Validation ────────────────────────────────────────────────────────────
#   kubectl apply --dry-run=server -f config/base/ray-cluster.yaml
#   kubectl get raycluster -n green-agent
#   kubectl exec -n green-agent deploy/green-agent -- ray status
#   kubectl logs -n green-agent -l component=head --tail=50

apiVersion: ray.io/v1
kind: RayCluster

metadata:
  name: green-agent-cluster
  namespace: green-agent

  labels:
    app.kubernetes.io/name: green-agent
    app.kubernetes.io/instance: green-agent
    app.kubernetes.io/version: "5.0.0"
    app.kubernetes.io/component: ray-cluster
    app.kubernetes.io/part-of: green-agent
    app.kubernetes.io/managed-by: kustomize

  annotations:
    # Apply after ConfigMap (-1) and before HPA (1)
    argocd.argoproj.io/sync-wave: "0"
    green-agent.io/base-version: "5.0.0"

spec:
  # Align with Guide v5.0 §Prerequisites: ray[default]>=2.9.0
  rayVersion: '2.9.0'

  # Ray's in-tree autoscaler is OFF by default. Without this, minReplicas /
  # maxReplicas on workerGroupSpecs are read but ignored.
  enableInTreeAutoscaling: true

  autoscalerOptions:
    upscalingMode: Default       # or Aggressive
    idleTimeoutSeconds: 60       # keep idle workers for 60s before scaling down
    resources: "CPU"             # or "GPU" — must match workerGroupSpecs

  # =========================================================================
  # Head group — orchestration only (num-cpus: '0')
  # =========================================================================
  headGroupSpec:
    replicas: 1

    rayStartParams:
      # Dashboard is admin-only; keep it on loopback and port-forward to view.
      # Change to '0.0.0.0' ONLY if the NetworkPolicy also scopes port 8265
      # to a trusted namespace.
      dashboard-host: '127.0.0.1'
      # Head does orchestration only — do not schedule user tasks here.
      num-cpus: '0'

    template:
      metadata:
        labels:
          app.kubernetes.io/name: green-agent
          app.kubernetes.io/instance: green-agent
          app.kubernetes.io/component: head
          app.kubernetes.io/part-of: green-agent

      spec:
        # No RBAC needed by Ray itself; do not automount an SA token.
        serviceAccountName: green-agent
        automountServiceAccountToken: false

        # PSA `restricted` — pod-level security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          fsGroup: 10001
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault

        terminationGracePeriodSeconds: 60

        # Optional — private registry auth
        # imagePullSecrets:
        #   - name: green-agent-registry

        # Optional — anti-affinity so head and workers don't co-locate
        # affinity:
        #   podAntiAffinity:
        #     preferredDuringSchedulingIgnoredDuringExecution:
        #       - weight: 100
        #         podAffinityTerm:
        #           topologyKey: kubernetes.io/hostname
        #           labelSelector:
        #             matchLabels:
        #               app.kubernetes.io/name: green-agent

        containers:
          - name: ray-head
            # Base image tag — overlays override via `images:` in
            # config/overlays/<env>/kustomization.yaml (name: green-agent).
            # Head and workers MUST share this tag.
            image: green-agent:v5.0.0
            imagePullPolicy: IfNotPresent

            ports:
              - name: http
                containerPort: 8000
                protocol: TCP
              - name: ray-dashboard
                containerPort: 8265
                protocol: TCP
              - name: ray-gcs
                containerPort: 6379
                protocol: TCP
              - name: ray-client
                containerPort: 10001
                protocol: TCP
              - name: ray-api
                containerPort: 10002
                protocol: TCP

            env:
              - name: AGENT_PORT
                value: "8000"
              - name: AGENT_HEALTH_PATH
                value: "/health"
              - name: PYTHONUNBUFFERED
                value: "1"
              - name: PYTHONDONTWRITEBYTECODE
                value: "1"
              - name: LOG_LEVEL
                value: "INFO"
              - name: LOG_FORMAT
                value: "json"

            envFrom:
              - configMapRef:
                  name: green-agent-config
              - secretRef:
                  name: green-agent-secrets
                  optional: true

            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "2"
                memory: "4Gi"

            # PSA `restricted` — container-level security context
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 10001
              runAsGroup: 10001
              capabilities:
                drop: ["ALL"]

            # Only `/health` exists. `/ready` does not — using it as a
            # readiness probe would block the head from ever becoming Ready.
            startupProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 5
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 24      # ~2 min for Ray init

            livenessProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3

            readinessProbe:
              httpGet:
                path: /health
                port: http
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3

            lifecycle:
              preStop:
                exec:
                  command: ["/bin/sh", "-c", "sleep 5 && kill -TERM 1 || true"]

            volumeMounts:
              - name: config
                mountPath: /app/config
                readOnly: true
              - name: policies
                mountPath: /app/policies
                readOnly: true
              - name: tmp
                mountPath: /tmp
              - name: checkpoints
                mountPath: /app/checkpoints
              - name: out
                mountPath: /out
              - name: cgroup
                mountPath: /sys/fs/cgroup
                readOnly: true

        volumes:
          - name: config
            configMap:
              name: green-agent-config
              items:
                - key: green_agent.yaml
                  path: green_agent.yaml
          - name: policies
            configMap:
              name: green-agent-config
              items:
                - key: green_policy.yaml
                  path: green_policy.yaml
                - key: symbolic_policy.yaml
                  path: symbolic_policy.yaml
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: checkpoints
            emptyDir:
              sizeLimit: 1Gi
          - name: out
            emptyDir:
              sizeLimit: 1Gi
          - name: cgroup
            hostPath:
              path: /sys/fs/cgroup
              type: Directory

  # =========================================================================
  # Worker group — task execution
  # =========================================================================
  workerGroupSpecs:
    - groupName: workers
      # Aligned with green_agent.yaml ray.min_workers / ray.max_workers
      replicas: 2
      minReplicas: 2
      maxReplicas: 20

      # Scale down 60s after the last task (Ray in-tree autoscaler)
      idleTimeoutSeconds: 60

      rayStartParams:
        # Worker CPU count MUST match resources.limits.cpu below so Ray
        # schedules tasks against real capacity.
        num-cpus: '1'

      template:
        metadata:
          labels:
            app.kubernetes.io/name: green-agent
            app.kubernetes.io/instance: green-agent
            app.kubernetes.io/component: worker
            app.kubernetes.io/part-of: green-agent

        spec:
          serviceAccountName: green-agent
          automountServiceAccountToken: false

          # PSA `restricted` — pod-level security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

          terminationGracePeriodSeconds: 60

          containers:
            - name: ray-worker
              # SAME tag as head — mixing tags breaks the Ray cluster join.
              image: green-agent:v5.0.0
              imagePullPolicy: IfNotPresent

              ports:
                - name: ray-worker
                  containerPort: 10002
                  protocol: TCP

              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: LOG_LEVEL
                  value: "INFO"
                - name: LOG_FORMAT
                  value: "json"

              envFrom:
                - configMapRef:
                    name: green-agent-config
                - secretRef:
                    name: green-agent-secrets
                    optional: true

              # Worker limits must be present — without them QoS is
              # BestEffort and the worker is the first pod evicted.
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1"
                  memory: "2Gi"

              # PSA `restricted` — container-level security context
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                capabilities:
                  drop: ["ALL"]

              # Worker probes — Ray workers expose /health on the
              # dashboard-agent proxy port (usually 10002). If your Ray
              # version exposes a different path, adjust both.
              livenessProbe:
                httpGet:
                  path: /health
                  port: ray-worker
                initialDelaySeconds: 60
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 3

              readinessProbe:
                httpGet:
                  path: /health
                  port: ray-worker
                initialDelaySeconds: 30
                periodSeconds: 15
                timeoutSeconds: 3
                failureThreshold: 3

              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "sleep 5 && kill -TERM 1 || true"]

              volumeMounts:
                - name: config
                  mountPath: /app/config
                  readOnly: true
                - name: policies
                  mountPath: /app/policies
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: checkpoints
                  mountPath: /app/checkpoints
                - name: out
                  mountPath: /out
                - name: cgroup
                  mountPath: /sys/fs/cgroup
                  readOnly: true

          volumes:
            - name: config
              configMap:
                name: green-agent-config
                items:
                  - key: green_agent.yaml
                    path: green_agent.yaml
            - name: policies
              configMap:
                name: green-agent-config
                items:
                  - key: green_policy.yaml
                    path: green_policy.yaml
                  - key: symbolic_policy.yaml
                    path: symbolic_policy.yaml
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: checkpoints
              emptyDir:
                sizeLimit: 1Gi
            - name: out
              emptyDir:
                sizeLimit: 1Gi
            - name: cgroup
              hostPath:
                path: /sys/fs/cgroup
                type: Directory

# =============================================================================
# GPU variant (commented — enable if workers use GPUs)
# =============================================================================
# Replace the worker group above with this when GPUs are available:
#
#   workerGroupSpecs:
#     - groupName: gpu-workers
#       replicas: 1
#       minReplicas: 0
#       maxReplicas: 8
#       rayStartParams:
#         num-cpus: '4'
#         num-gpus: '1'
#       template:
#         spec:
#           containers:
#             - name: ray-worker
#               image: green-agent:v5.0.0
#               resources:
#                 requests:
#                   cpu: "4"
#                   memory: "16Gi"
#                   nvidia.com/gpu: "1"
#                 limits:
#                   cpu: "4"
#                   memory: "16Gi"
#                   nvidia.com/gpu: "1"
#               # ...

# =============================================================================
# What's Not in Scope
# =============================================================================
# • Cross-cluster Ray federation — single-cluster only.
# • KubeRay operator installation — assume the CRD is already registered.
# • Node autoscaling (Karpenter / Cluster Autoscaler) — cluster-level add-on.
# • Custom Ray images with GPU drivers — supply your own base image.

# =============================================================================
# Changelog
# =============================================================================
# 5.0.0 (2026-04-10)
#   Fixed:
#     • YAML indentation — containers, ports, resources, and probes were
#       misindented and made the manifest unparseable.
#     • Removed the `# ... rest of config` placeholder that broke parsing.
#     • Added metadata.namespace: green-agent.
#     • Head image and worker image aligned to green-agent:v5.0.0
#       (worker was green-agent:test).
#     • Probe path /ready → /health (matches Deployment v5.0; /ready 404s).
#     • Worker resources gained limits (requests-only caused BestEffort).
#   Added:
#     • spec.enableInTreeAutoscaling: true + autoscalerOptions.
#     • Full pod + container securityContext (PSA restricted).
#     • serviceAccountName + automountServiceAccountToken: false.
#     • envFrom (ConfigMap + Secret) and volumeMounts (config, policies,
#       checkpoints, out, tmp, cgroup).
#     • startupProbe + livenessProbe + readinessProbe on both head and worker.
#     • lifecycle.preStop + terminationGracePeriodSeconds: 60.
#     • Ray head num-cpus: '0' (orchestration-only).
#     • Worker num-cpus aligned with resources.limits.cpu.
#     • headGroupSpec.replicas: 1 explicit.
#     • Worker idleTimeoutSeconds: 60.
#     • Worker minReplicas / maxReplicas aligned with green_agent.yaml
#       (2 / 20).
#     • app.kubernetes.io/* labels on metadata and both pod templates.
#     • argocd.argoproj.io/sync-wave: "0".
#     • Metadata block + header + validation recipe + "What's Not in Scope".
#     • GPU worker variant (commented).
#   Changed:
#     • dashboard-host '0.0.0.0' → '127.0.0.1' (port-forward for admin).
#     • rayVersion '2.7.0' → '2.9.0' (Guide v5.0 Prerequisites).
#   Removed:
#     • Stray `# ... rest of config` placeholder.
# =============================================================================

# =============================================================================
# Reviewer Checklist
# =============================================================================
#   [ ] YAML parses: `kubectl apply --dry-run=server -f config/base/ray-cluster.yaml`.
#   [ ] metadata.namespace is green-agent.
#   [ ] Head and worker images are the SAME tag (never `:test`).
#   [ ] No `readinessProbe: /ready` — only `/health`.
#   [ ] `enableInTreeAutoscaling: true` + `autoscalerOptions` present.
#   [ ] Both pod templates carry PSA `restricted` securityContext.
#   [ ] Both containers set `readOnlyRootFilesystem: true` and `/tmp` emptyDir.
#   [ ] envFrom pulls `green-agent-config` + `green-agent-secrets`.
#   [ ] volumeMounts include `/app/config`, `/app/policies`, `/out`, `/tmp`,
#       `/sys/fs/cgroup`.
#   [ ] Worker `num-cpus` equals `resources.limits.cpu`.
#   [ ] Head `num-cpus: '0'` unless the head intentionally runs tasks.
#   [ ] `dashboard-host` is `127.0.0.1` unless NetworkPolicy restricts 8265.
#   [ ] `kubectl get raycluster -n green-agent` shows both groups.
#   [ ] `kubectl exec -n green-agent deploy/green-agent -- ray status`
#       reports healthy head + `minReplicas` workers.
# =============================================================================
