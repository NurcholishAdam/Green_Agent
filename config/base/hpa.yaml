# Changelog
# =============================================================================
# 5.0.0 (2026-11-13)
#   Fixed:
#     • scaleTargetRef now targets Deployment (apps/v1) — RayCluster has no
#       /scale subresource, so the previous HPA was a no-op.
#     • Added namespace: green-agent (was implicitly "default").
#     • Added full app.kubernetes.io/* labels.
#     • Added argocd.argoproj.io/sync-wave: "1" (after Deployment wave 0).
#   Added:
#     • behavior.policies (rate limits) for scaleUp and scaleDown.
#     • behavior.selectPolicy for both directions.
#     • Carbon-aware metric (green_agent_carbon_intensity_gco2_kwh).
#     • Queue-depth metric (green_agent_queue_depth).
#     • RayCluster autoscaler alternative (commented footer).
#     • Prometheus Adapter prerequisite snippet.
#     • Validation recipe + companion resources.
#   Changed:
#     • minReplicas 2 → 3 (zone-failure survival).
#     • scaleDown stabilization 300s → 600s (matches grace period).
#     • scaleUp stabilization 60s → 30s (policies cap the rate instead).
#   Removed:
#     • Memory metric (memory does not shrink; caused over-provisioning).
