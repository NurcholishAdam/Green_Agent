# config/base/kustomization.yaml
#
# Green Agent — Kustomize base
# ============================
#
# Simplified standalone Green Agent Kubernetes base.
# No AgentBeats integration.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: green-agent

labels:
  - pairs:
      app.kubernetes.io/name: green-agent
      app.kubernetes.io/instance: green-agent
      app.kubernetes.io/version: "5.0.0"
      app.kubernetes.io/part-of: green-agent
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

commonAnnotations:
  green-agent.io/base-version: "5.0.0"
  green-agent.io/managed-by: kustomize

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: green-agent
    newTag: v5.0.0

generatorOptions:
  disableNameSuffixHash: false
  labels:
    app.kubernetes.io/component: config

sortOptions:
  order: fifo

buildMetadata:
  - managedByLabel
  - originAnnotations
