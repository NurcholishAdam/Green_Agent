# config/base/serviceaccount.yaml
#
# Green Agent — ServiceAccount
# ============================
#
# Provides the Kubernetes identity used by the Green Agent Deployment.

apiVersion: v1
kind: ServiceAccount

metadata:
  name: green-agent
  namespace: green-agent

  labels:
    app.kubernetes.io/name: green-agent
    app.kubernetes.io/instance: green-agent
    app.kubernetes.io/version: "5.0.0"
    app.kubernetes.io/component: service-account
    app.kubernetes.io/part-of: green-agent
    app.kubernetes.io/managed-by: kustomize

  annotations:
    green-agent.io/base-version: "5.0.0"
    green-agent.io/managed-by: kustomize

automountServiceAccountToken: false
