#   tls:
#     enabled: true
#     cert_file: "/etc/tls/tls.crt"
#     key_file:  "/etc/tls/tls.key"
# enhancements:
#   flexgen:
#     enabled: true
#   zero_trust:
#     enabled: true
#   privacy:
#     enabled: true
# carbon:
#   api_provider: "electricitymap"

# =============================================================================
# What's Not in Scope
# =============================================================================
# • Non-YAML config formats (JSON, TOML) — the app reads YAML only.
# • Secret storage — see Kubernetes Secret / .env.example.
# • Overlay generation — use Kustomize or Helm, not manual copies.
# • Scheduler policy — Ray handles it; only worker counts are here.

