# config/base/deployment.yaml
#
# Green Agent — Deployment
# ========================
#
# Runs Green Agent under the Kubernetes restricted Pod Security Standard.
# No AgentBeats integration and no privileged hostPath mounts.

apiVersion: apps/v1
kind: Deployment

metadata:
  name: green-agent
  namespace: green-agent

  labels:
    app.kubernetes.io/name: green-agent
    app.kubernetes.io/instance: green-agent
    app.kubernetes.io/version: "5.0.0"
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: green-agent
    app.kubernetes.io/managed-by: kustomize

  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  minReadySeconds: 10

  selector:
    matchLabels:
      app.kubernetes.io/name: green-agent
      app.kubernetes.io/instance: green-agent

  template:
    metadata:
      labels:
        app.kubernetes.io/name: green-agent
        app.kubernetes.io/instance: green-agent
        app.kubernetes.io/version: "5.0.0"
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: green-agent
        app.kubernetes.io/managed-by: kustomize

    spec:
      serviceAccountName: green-agent
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 30

      containers:
        - name: green-agent
          image: green-agent:v5.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: AGENT_PORT
              value: "8000"
            - name: AGENT_HEALTH_PATH
              value: "/health"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_FORMAT
              value: "json"
            - name: ENHANCEMENTS_ENABLED
              value: "true"

          envFrom:
            - configMapRef:
                name: green-agent-config
            - secretRef:
                name: green-agent-secrets
                optional: true

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5 && kill -TERM 1 || true

          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true

            - name: policies
              mountPath: /app/policies
              readOnly: true

            - name: tmp
              mountPath: /tmp

            - name: checkpoints
              mountPath: /app/checkpoints

            - name: out
              mountPath: /out

      volumes:
        - name: config
          configMap:
            name: green-agent-config
            items:
              - key: green_agent.yaml
                path: green_agent.yaml

        - name: policies
          configMap:
            name: green-agent-config
            items:
              - key: green_policy.yaml
                path: green_policy.yaml
              - key: symbolic_policy.yaml
                path: symbolic_policy.yaml

        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

        - name: checkpoints
          emptyDir:
            sizeLimit: 1Gi

        - name: out
          emptyDir:
            sizeLimit: 1Gi
