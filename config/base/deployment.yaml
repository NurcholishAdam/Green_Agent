#       ports:
#         - { protocol: TCP, port: 443 }   # carbon APIs, RLHF, etc.
#         - { protocol: UDP, port: 53 }    # DNS
#
# ── Validation ──────────────────────────────────────────────────────────
#   # Static check (no cluster needed)
#   kubectl apply --dry-run=client -f config/base/deployment.yaml
#
#   # Server-side check (validates against real API + Admission controllers)
#   kubectl apply --dry-run=server -f config/base/deployment.yaml
#
#   # Confirm probes are wired
#   kubectl get deploy green-agent -n green-agent \
#     -o jsonpath='{.spec.template.spec.containers[0].livenessProbe}'
#
#   # Confirm securityContext satisfies PSA restricted
#   kubectl get deploy green-agent -n green-agent \
#     -o jsonpath='{.spec.template.spec.containers[0].securityContext}'
