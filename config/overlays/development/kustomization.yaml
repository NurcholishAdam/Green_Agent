# config/overlays/development/kustomization.yaml
#
# Green Agent — development overlay for Kind CI tests

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: green-agent-development

resources:
  - ../../base

images:
  - name: green-agent
    newName: green-agent
    newTag: k8s-test

patches:
  - target:
      kind: Deployment
      name: green-agent
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
