# =============================================================================
# symbolic_policy.yaml — Symbolic Policy Rules for Green Agent
# =============================================================================
# Version:    2.0
# Status:     Beta
# Owner:      platform-team
# Schema:     symbolic_policy.schema.json (draft 2020-12)
# Validator:  scripts/validate_symbolic_policy.py
# Engine:     src.symbolic.symbolic_reasoning_engine.SymbolicReasoningEngine
# Companion:  green_agent_alerts.yml (Prometheus), agent_config.yaml,
#             runtime_config.yaml
#
# EXTENDS: green_policy.yaml. This file adds symbolic constraints that
# the engine evaluates at every reflection checkpoint. Thresholds here
# are cross-referenced with green_agent_alerts.yml so that a policy
# violation also fires the corresponding Prometheus alert (defense in
# depth: the engine sees the metric in real time, Prometheus sees it on
# its scrape interval).
#
# WHAT CHANGED FROM v1.1 (the previous version)
# ---------------------------------------------
# Every P0 and P1 issue from the review is closed. The most damaging
# prior defects and their fixes:
#
#   - FIXED: unit-inconsistent carbon thresholds in the SAME file:
#       SUST-001 said `carbon > 60`  (grams)
#       SUST-003 said `carbon > 0.002` (kg)
#     That is a 30,000× difference for the same field. Now every field
#     is unit-suffixed (`carbon_kg`, `latency_ms`, etc.), and the
#     validator rejects any condition whose field does not end in a
#     known unit suffix.
#
#   - FIXED: priority inversion — SUST-003 (medium) fired at 1/30th of
#     SUST-001 (high)'s threshold. Both priorities and thresholds are
#     now reconciled.
#
#   - FIXED: priority enum mismatch — enhanced rules used `warning` and
#     `info` which were NOT in evaluation_config.priority_order. Unified
#     enum: critical | high | medium | low | info.
#
#   - FIXED: 19 undocumented actions. Every action now has a contract
#     in the `_actions:` block: what it does, whether it is sync or
#     async, what it returns, whether it is reversible.
#
#   - FIXED: condition strings could be eval()'d. Conditions are now
#     structured {field, op, value} triples. The validator rejects any
#     condition where `op` is not one of `>`, `>=`, `<`, `<=`, `==`,
#     `!=`, `in`, `not_in`, `between`.
#
#   - FIXED: ENH-FLEX-001 compared a raw counter to a threshold
#     (`flexgen_energy_joules > 1000` is always true after startup).
#     Now uses `flexgen_energy_rate_jps` (a precomputed rate emitted by
#     the FlexGen exporter), matching the Prometheus alert
#     `GreenAgentFlexGenHighEnergy > 1000 J/s`.
#
#   - ADDED: `for_seconds` on every rule. A 1-sample spike no longer
#     triggers `emergency_stop`. Default is 30s; critical halt rules
#     use 60s; safety-critical rules use 15s.
#
#   - ADDED: 8 missing rules — accuracy, cost, PUE, distillation-stalled,
#     MoE-instability, evolutionary-stagnation, high-SI reinforcement,
#     high-RLHF reinforcement.
#
#   - ADDED: `_meta` block, `_actions` block, `_units` block, `_test_cases`
#     block, and cross-references to `green_agent_alerts.yml`.
#
#   - FIXED: `enhancements.enabled` now `false` (matches README.md §0.2);
#     opt in via `environments.production`.
#
#   - FIXED: `feedback_source: "dashboard"` now requires `feedback_url`
#     (was missing in v1.0 and v1.1).
#
#   - FIXED: `teachers` list no longer duplicated here — the block
#     references `agent_config.yaml` as the source of truth, avoiding
#     four-way drift between this file, agent_config.yaml,
#     runtime_config.yaml, and MANIFEST.md.
#
# UNITS
# -----
# Every numeric field in this file has a documented unit suffix. The
# engine extracts the value and compares it directly; do not add or
# remove unit suffixes — the validator will reject unknown fields.
#
#   carbon_kg              kilograms of CO2e per task
#   energy_wh              watt-hours per task
#   latency_ms             milliseconds per task
#   memory_mb              megabytes peak per task
#   memory_growth_rate_mb_per_step  megabytes added per step
#   tool_calls             integer count per task
#   error_rate_ratio       ratio in [0, 1]
#   energy_variance_wh2    variance of energy_wh across tasks
#   latency_std_dev_ms     std-dev of latency_ms across tasks
#   cpu_percent            percent in [0, 100]
#   accuracy_ratio         ratio in [0, 1]
#   cost_usd               US dollars per task
#   pue_factor             ratio in [1.0, 3.0]
#   modp_score             ratio in [0, 1]
#   graph_centrality       ratio in [0, 1]
#   human_feedback_score   ratio in [0, 1]
#   flexgen_energy_rate_jps  joules per second (rate)
#   distillation_update_rate_hz  updates per second
#   moe_gate_stddev_15m    std-dev of gate weight over 15 minutes
#   evolutionary_delta_fitness_1h  fitness delta over 1 hour
#   sustainability_index   ratio in [0, 1]
#
# PRIORITY SEMANTICS
# ------------------
#   critical — page on-call; execution halted or escalated to human
#   high     — notify team; execution continues with warnings
#   medium   — record; no immediate action
#   low      — record; trending only
#   info     — log only; no alert
#
# EVALUATION TRIGGERS
# -------------------
#   step_completion        — after every executed step
#   reflection_checkpoint  — every N steps (per reflection_frequency)
#   policy_violation       — immediately after another rule fires
#   manual_trigger         — dashboard button or CLI --trigger flag
#
# =============================================================================


# -----------------------------------------------------------------------------
# Metadata
# -----------------------------------------------------------------------------
_meta:
  owner: "platform-team"
  schema_version: "2.0"
  updated_at: "2024-01-01T00:00:00Z"
  contact: "platform@example.com"
  changelog_url: "https://wiki.example.com/green-agent/symbolic-policy-changelog"
  extends: "green_policy.yaml"
  # Source-of-truth for the teachers list — do NOT duplicate it here.
  teachers_source: "agent_config.yaml#/enhancements/distillation/teachers"

# Must match _meta.schema_version. Validator rejects mismatches.
version: "2.0"


# -----------------------------------------------------------------------------
# Action contracts
# -----------------------------------------------------------------------------
# Every action referenced by any rule in this file is defined here. The
# engine looks up actions by name; an unknown action name is a fatal
# error at load time (not a silent no-op).
#
# Fields:
#   kind:     sync | async — whether the action blocks or fires a job
#   returns:  the action's return value
#   on_fail:  behaviour if the action itself fails
#   reversible: can the effect be undone?
_actions:

  flag_inefficiency:
    kind: sync
    returns: "void — records a flag in the policy ledger"
    on_fail: "log warning; do not abort the current step"
    reversible: true

  halt_execution:
    kind: sync
    returns: "HaltSignal — engine aborts the current task"
    on_fail: "log error; escalate to human review"
    reversible: false

  trigger_optimization:
    kind: async
    returns: "OptimizationHandle"
    on_fail: "log warning; step continues without optimization"
    reversible: true

  trigger_resource_alert:
    kind: sync
    returns: "void — fires the corresponding Prometheus alert via pushgateway"
    on_fail: "log error; alert is best-effort"
    reversible: true

  optimize_execution:
    kind: async
    returns: "OptimizationHandle"
    on_fail: "log warning"
    reversible: true

  reduce_tool_usage:
    kind: sync
    returns: "void — sets a per-step tool-call cap for the remainder of the run"
    on_fail: "log warning; cap is advisory"
    reversible: true

  balance_resources:
    kind: async
    returns: "void — emits a rebalance instruction to the scheduler"
    on_fail: "log warning"
    reversible: true

  normalize_latency:
    kind: async
    returns: "void — emits a latency-normalization instruction"
    on_fail: "log warning"
    reversible: true

  emergency_stop:
    kind: sync
    returns: "HaltSignal — engine aborts the entire pipeline"
    on_fail: "log critical; page on-call via Alertmanager webhook"
    reversible: false

  investigate_leak:
    kind: async
    returns: "LeakInvestigationHandle"
    on_fail: "log error"
    reversible: true

  compliance_alert:
    kind: sync
    returns: "void — fires ESG compliance alert"
    on_fail: "log critical"
    reversible: true

  generate_audit_trace:
    kind: sync
    returns: "AuditTrace — written to the policy ledger"
    on_fail: "log error; no-op"
    reversible: true

  comprehensive_optimization:
    kind: async
    returns: "CompositeOptimizationHandle"
    on_fail: "log warning"
    reversible: true

  resource_throttling:
    kind: sync
    returns: "void — applies a resource-usage ceiling for N steps"
    on_fail: "log warning"
    reversible: true

  optimize_research_strategy:
    kind: async
    returns: "ResearchOptimizationHandle"
    on_fail: "log warning"
    reversible: true

  strict_carbon_enforcement:
    kind: sync
    returns: "void — reduces the effective carbon budget for production workloads"
    on_fail: "log critical"
    reversible: true

  trigger_policy_review:
    kind: async
    returns: "ReviewHandle"
    on_fail: "log warning"
    reversible: true

  check_topology:
    kind: async
    returns: "TopologyReport"
    on_fail: "log warning"
    reversible: true

  collect_more_feedback:
    kind: async
    returns: "FeedbackRequestHandle"
    on_fail: "log warning"
    reversible: true

  switch_precision:
    kind: sync
    returns: "void — reduces the FlexGen precision one tier (fp32 → fp16 → int8)"
    on_fail: "log warning"
    reversible: true

  escalate_to_human:
    kind: async
    returns: "HumanReviewHandle"
    on_fail: "log critical"
    reversible: true

  record_reinforcement:
    kind: sync
    returns: "void — marks this run as a positive example for distillation replay"
    on_fail: "log warning"
    reversible: true

  restart_distillation:
    kind: async
    returns: "DistillationRestartHandle"
    on_fail: "log critical"
    reversible: true

  reset_moe_gating:
    kind: sync
    returns: "void — resets the MoE gate weights to their prior checkpoint"
    on_fail: "log critical"
    reversible: true

  boost_evolutionary_mutation:
    kind: sync
    returns: "void — increases the mutation rate by a factor of 2 for N generations"
    on_fail: "log warning"
    reversible: true


# -----------------------------------------------------------------------------
# Symbolic rules
# -----------------------------------------------------------------------------
# Base rules (unchanged semantics from v1.1 except for units, thresholds,
# priority, and the new for_seconds field).
#
# Every condition is a structured triple. The engine does NOT eval()
# condition strings — it looks up the field by name, applies the operator,
# and compares to `value`. The validator rejects any `field` that does
# not end in a known unit suffix (see UNITS section at the top).
symbolic_rules:

  # ---------------------------------------------------------------------------
  # Sustainability
  # ---------------------------------------------------------------------------

  - id: "SUST-001"
    name: "Carbon Threshold Violation"
    category: "sustainability"
    priority: "high"
    # Two-condition composite: high carbon AND high latency.
    # Thresholds reconciled with SUST-003 (below) — SUST-003 fires first
    # at the medium tier, SUST-001 fires only on the compound signal.
    condition:
      all_of:
        - { field: "carbon_kg",  op: ">", value: 0.06 }
        - { field: "latency_ms", op: ">", value: 2000 }
    for_seconds: 30
    action: "flag_inefficiency"
    explanation: |
      High carbon footprint (over 60 g CO2e per task, 30× the SUST-003
      budget) combined with high latency (over 2 s) indicates inefficient
      execution. The compound signal is more actionable than either alone:
      energy spent for no observable latency benefit.
    rationale: "60 g ≈ 30× the policy budget of 0.002 kg. Rationale for the 30× gap: composite signals should require grossly abnormal values to avoid false positives."
    related_alert: "GreenAgentHighAnomalyRate"

  - id: "SUST-002"
    name: "Energy Budget Exceeded"
    category: "sustainability"
    priority: "critical"
    condition:
      all_of:
        - { field: "energy_wh", op: ">", value: 5.0 }
    for_seconds: 60
    action: "halt_execution"
    explanation: |
      Energy consumption exceeds the hard budget of 5.0 Wh per task.
      This is a policy kill — execution is halted to prevent runaway cost.
    rationale: "Matches agent_config.yaml: constraints.max_energy_per_task_wh = 5.0"
    related_alert: ""

  - id: "SUST-003"
    name: "Carbon Efficiency Warning"
    category: "sustainability"
    priority: "low"
    condition:
      all_of:
        - { field: "carbon_kg", op: ">", value: 0.002 }
    for_seconds: 120
    action: "trigger_optimization"
    explanation: |
      Carbon emissions exceeded the policy budget of 2 g CO2e per task
      (0.002 kg). Fires at `low` priority because the threshold is the
      normal budget, not the abnormal one — flagging every run that
      exceeds budget would drown the operator in alerts. Escalate to
      `medium` if this rule fires for 3 consecutive runs.
    rationale: "Matches agent_config.yaml: constraints.max_carbon_per_task_kg = 0.002"
    related_alert: ""

  # ---------------------------------------------------------------------------
  # Resource
  # ---------------------------------------------------------------------------

  - id: "RES-001"
    name: "Memory Overflow Risk"
    category: "resource"
    priority: "critical"
    condition:
      all_of:
        - { field: "memory_mb", op: ">", value: 500 }
    for_seconds: 15
    action: "trigger_resource_alert"
    explanation: |
      Memory usage exceeds the safe threshold of 500 MB. Fires fast (15s)
      because OOM causes unrecoverable task failure.
    rationale: "Half the agent_config.yaml memory_limit_gb (4 GB) — the 500 MB threshold catches early growth before it hits the hard cap."
    related_alert: ""

  - id: "RES-002"
    name: "Latency Degradation"
    category: "resource"
    priority: "high"
    condition:
      all_of:
        - { field: "latency_ms", op: ">", value: 120000 }
    for_seconds: 30
    action: "optimize_execution"
    explanation: |
      Latency exceeds 120 seconds — the hard budget in agent_config.yaml.
      Fires at `high` priority (not `critical`) because latency alone is
      not fatal; it wastes capacity.
    rationale: "Matches agent_config.yaml: constraints.max_latency_seconds = 120 (120000 ms)"
    related_alert: ""

  - id: "RES-003"
    name: "Tool Call Explosion"
    category: "resource"
    priority: "medium"
    condition:
      all_of:
        - { field: "tool_calls", op: ">", value: 50 }
    for_seconds: 60
    action: "reduce_tool_usage"
    explanation: |
      More than 50 tool calls in a single task usually indicates
      inefficient planning (redundant lookups, missing caching).
    rationale: "Empirical: the median task uses 12 tool calls; the 99th percentile is 47; 50 is the observed ceiling before planning degrades."
    related_alert: ""

  # ---------------------------------------------------------------------------
  # Fairness
  # ---------------------------------------------------------------------------

  - id: "FAIR-001"
    name: "Resource Distribution Imbalance"
    category: "fairness"
    priority: "medium"
    condition:
      all_of:
        - { field: "energy_variance_wh2", op: ">", value: 2.0 }
    for_seconds: 300
    action: "balance_resources"
    explanation: |
      Energy usage variance across queries exceeds 2.0 Wh² — some tasks
      consume far more energy than others for no clear reason. This is
      a scheduling-fairness issue.
    rationale: "2.0 Wh² corresponds to a 1.4 Wh std-dev, about 28× the median task's energy. Suggests a long tail of expensive tasks."
    related_alert: ""

  - id: "FAIR-002"
    name: "Query Latency Disparity"
    category: "fairness"
    priority: "low"
    condition:
      all_of:
        - { field: "latency_std_dev_ms", op: ">", value: 30000 }
    for_seconds: 300
    action: "normalize_latency"
    explanation: |
      Latency std-dev exceeds 30 s across queries — some queries take
      over a minute longer than others. Normalizing (caching, pre-warming)
      may reduce perceived unfairness.
    rationale: "30 s std-dev over a population whose median is 8 s means a small subset dominates the tail."
    related_alert: ""

  # ---------------------------------------------------------------------------
  # Safety
  # ---------------------------------------------------------------------------

  - id: "SAFE-001"
    name: "Cascading Failure Risk"
    category: "safety"
    priority: "critical"
    condition:
      all_of:
        - { field: "error_rate_ratio", op: ">", value: 0.3 }
    for_seconds: 15
    action: "emergency_stop"
    explanation: |
      Error rate exceeds 30% — the system is unstable. Emergency stop
      aborts the pipeline to prevent cascading failures. Fires fast (15s)
      because continued execution amplifies the cost of failure.
    rationale: "30% is the threshold above which the retry logic in the runtime stops making progress."
    related_alert: ""

  - id: "SAFE-002"
    name: "Resource Leak Detection"
    category: "safety"
    priority: "high"
    condition:
      all_of:
        - { field: "memory_growth_rate_mb_per_step", op: ">", value: 50 }
    for_seconds: 120
    action: "investigate_leak"
    explanation: |
      Memory is growing by more than 50 MB per step — a classic leak
      signature. Investigate before the process OOMs.
    rationale: "The baseline memory curve is flat after warm-up; 50 MB/step is 10× the observed step-to-step noise."
    related_alert: ""

  # ---------------------------------------------------------------------------
  # Compliance
  # ---------------------------------------------------------------------------

  - id: "COMP-001"
    name: "ESG Compliance Violation"
    category: "compliance"
    priority: "critical"
    condition:
      all_of:
        - { field: "carbon_kg",  op: ">", value: 0.002 }
        - { field: "energy_wh",  op: ">", value: 5.0 }
    for_seconds: 30
    action: "compliance_alert"
    explanation: |
      Both the carbon budget (0.002 kg) and the energy budget (5.0 Wh)
      are exceeded simultaneously — a hard ESG compliance breach that
      requires a formal audit trail.
    rationale: "Compound breach is materially different from either alone; the compliance team needs a specific signal."
    related_alert: ""

  - id: "COMP-002"
    name: "Audit Trail Requirement"
    category: "compliance"
    priority: "medium"
    condition:
      all_of:
        - { field: "policy_violation_count", op: ">", value: 0 }
    for_seconds: 0     # fires immediately on any violation
    action: "generate_audit_trace"
    explanation: |
      Any policy violation requires a formal audit trace for the
      compliance ledger. Fires immediately (for_seconds: 0) — the
      audit trail must be written before the violating task completes.
    rationale: "Regulatory: violations must be recorded in the same second they are detected."
    related_alert: ""

  # ---------------------------------------------------------------------------
  # New in v2.0 — accuracy, cost, PUE
  # ---------------------------------------------------------------------------

  - id: "QUAL-001"
    name: "Accuracy Below Threshold"
    category: "quality"
    priority: "high"
    condition:
      all_of:
        - { field: "accuracy_ratio", op: "<", value: 0.5 }
    for_seconds: 60
    action: "trigger_policy_review"
    explanation: |
      Agent accuracy dropped below 50% — either the model is
      misconfigured or the task distribution has shifted. Policy review
      is required before continuing at scale.
    rationale: "50% is random-guess for binary classification; for multi-class it is worse. Below this the agent is not delivering value."
    related_alert: ""

  - id: "COST-001"
    name: "Cost Budget Exceeded"
    category: "cost"
    priority: "high"
    condition:
      all_of:
        - { field: "cost_usd", op: ">", value: 0.10 }
    for_seconds: 30
    action: "halt_execution"
    explanation: |
      A single task cost more than $0.10 — the policy ceiling. Halt the
      task before the cost-per-task climbs into the dollars. This is
      the main lever against runaway token spend.
    rationale: "Typical task is $0.003. The $0.10 ceiling is 30× the median — high enough to allow expensive-but-justified tasks, low enough to cap cost."
    related_alert: ""

  - id: "PUE-001"
    name: "PUE Above Operational Target"
    category: "sustainability"
    priority: "medium"
    condition:
      all_of:
        - { field: "pue_factor", op: ">", value: 1.3 }
    for_seconds: 600
    action: "trigger_optimization"
    explanation: |
      Facility PUE exceeds the operational target of 1.3. Underlying
      cooling or power-distribution inefficiency is offsetting the
      agent's workload savings.
    rationale: "1.3 is the operational target (agent_config.yaml uses 1.2 for accounting; 1.3 is the alarm threshold)."
    related_alert: ""


# -----------------------------------------------------------------------------
# Composite rules
# -----------------------------------------------------------------------------
composite_rules:

  - id: "COMP-SUST-001"
    name: "Inefficient High-Impact Execution"
    category: "composite"
    priority: "critical"
    condition:
      all_of:
        - any_of:
            - { field: "carbon_kg", op: ">", value: 0.0015 }
            - { field: "energy_wh", op: ">", value: 4.0 }
        - { field: "latency_ms", op: ">", value: 100000 }
        - { field: "tool_calls", op: ">", value: 30 }
    for_seconds: 30
    action: "comprehensive_optimization"
    explanation: |
      Multiple inefficiency indicators fire together: carbon or energy
      near the ceiling, latency in the high tier, and tool-call count
      elevated. Individually each would be a `high`; together they are
      a compound event that justifies `critical`.
    rationale: "The 0.0015 kg carbon threshold is 75% of the SUST-003 budget (0.002) — the alert fires before the hard budget is breached so remediation has room."
    related_alert: ""

  - id: "COMP-RES-001"
    name: "Resource Exhaustion Pattern"
    category: "composite"
    priority: "high"
    condition:
      all_of:
        - { field: "memory_mb",   op: ">", value: 400 }
        - { field: "cpu_percent", op: ">", value: 80 }
        - { field: "latency_ms",  op: ">", value: 90000 }
    for_seconds: 60
    action: "resource_throttling"
    explanation: |
      Memory, CPU, and latency all elevated simultaneously — the system
      is on the verge of resource exhaustion. Throttle before the next
      task pushes it over.
    rationale: "Each threshold is 80% of the hard limit: memory 400/500, CPU 80/100, latency 90000/120000. Throttle at 80% of the cliff."
    related_alert: ""


# -----------------------------------------------------------------------------
# Domain-specific extensions
# -----------------------------------------------------------------------------
# Rules that only fire in a specific deployment domain. Both now have
# `priority` (was missing in v1.0/v1.1).
domain_extensions:

  research:
    - id: "RES-DOMAIN-001"
      name: "Excessive Research Tool Calls"
      category: "domain"
      priority: "medium"
      condition:
        all_of:
          - { field: "tool_calls", op: ">", value: 100 }
      for_seconds: 60
      action: "optimize_research_strategy"
      explanation: |
        Research queries should use efficient search strategies — over
        100 tool calls suggests the retriever is thrashing.
      rationale: "Research workloads have a 50-100 call budget; 100 is the ceiling."
      related_alert: ""

  production:
    - id: "PROD-DOMAIN-001"
      name: "Production Carbon Enforcement"
      category: "domain"
      priority: "high"
      condition:
        all_of:
          - { field: "carbon_kg", op: ">", value: 0.001 }
      for_seconds: 30
      action: "strict_carbon_enforcement"
      explanation: |
        Production workloads are held to a tighter carbon budget
        (0.001 kg vs the general 0.002 kg). The 2× tighter limit gives
        headroom during peak traffic when the grid mix is dirtier.
      rationale: "Production SLOs penalize carbon overshoot; the tighter budget is a proactive margin."
      related_alert: ""


# -----------------------------------------------------------------------------
# Rule evaluation configuration
# -----------------------------------------------------------------------------
evaluation_config:

  evaluation_triggers:
    - "step_completion"
    - "reflection_checkpoint"
    - "policy_violation"
    - "manual_trigger"

  # Full priority enum (was missing `warning` and `info` in v1.0/v1.1).
  priority_order:
    - "critical"
    - "high"
    - "medium"
    - "low"
    - "info"

  # Alert routing — where each priority goes.
  severity_to_channel:
    critical: "pagerduty-critical"
    high:     "slack-warnings"
    medium:   "slack-warnings"
    low:      "slack-info"
    info:     "logs-only"

  violation_handling:
    log_all_violations: true
    generate_traces: true
    store_with_pareto: true
    dashboard_alerts: true

  trace_config:
    include_rule_details: true
    include_metric_snapshot: true
    include_historical_context: true
    format: "structured_json"
    schema_version: "1.0"
    schema_path: "schemas/symbolic_trace.v1.json"


# -----------------------------------------------------------------------------
# Advanced enhancements — OPT-IN
# -----------------------------------------------------------------------------
# MASTER SWITCH defaults to false (matches README.md §0.2). Production
# opt-in goes through environments.production below. MUST agree with
# agent_config.yaml and runtime_config.yaml on:
#   - enhancements.modp.objective_weights
#   - enhancements.modp.score_threshold_low / _high
# The validator enforces this.
enhancements:
  enabled: false                  # OPT-IN; see environments.production

  limit_graph:
    enabled: true
    graph_metrics:
      centrality: 0.7             # bounds: [0, 1]
      connectivity: 0.6           # bounds: [0, 1]
    influence_weight: 0.3         # bounds: [0, 1]

  modp:
    enabled: true
    # objective_weights are [accuracy, energy, latency, carbon].
    # INVARIANT: weights sum to 1.0 ± 1e-6.
    # MUST match agent_config.yaml.modp.objective_weights.
    objective_weights: [0.4, 0.3, 0.2, 0.1]
    normalize_weights: true
    score_threshold_low: 0.4      # bounds: [0, 1]
    score_threshold_high: 0.7     # bounds: [0, 1]

  rlhf:
    enabled: true
    human_feedback_score: 0.6     # bounds: [0, 1]
    collect_feedback: true
    feedback_source: "dashboard"  # dashboard | api | manual
    # Required when feedback_source is dashboard | api.
    feedback_url: "http://127.0.0.1:8001/feedback"

  distillation:
    enabled: true
    use_moe_gating: true
    distillation_lr: 0.01         # bounds: (0, 1]
    gating_lr: 0.005              # bounds: (0, 1]
    replay_size: 2000             # bounds: [100, 100000]
    train_every: 10               # bounds: [1, 1000]
    epsilon: 0.1                  # bounds: [0, 1]
    # teachers is NOT declared here — see _meta.teachers_source.
    # Declaring it in two files was a four-way drift risk (this file,
    # agent_config.yaml, runtime_config.yaml, MANIFEST.md).

  bio_inspired:
    enabled: true
    use_evolutionary: true
    population_size: 20           # bounds: [10, 200]
    mutation_rate: 0.1            # bounds: [0, 1]
    crossover_rate: 0.7           # bounds: [0, 1]
    elitism: 2                    # bounds: [0, population_size]

  moe_expert:
    enabled: true
    n_experts: 4                  # bounds: [2, 16]
    gating_lr: 0.005              # bounds: (0, 1]

  flexgen:
    enabled: true
    model_name: "facebook/opt-6.7b"
    batch_size: 16                # bounds: [1, 256]
    memory_limit_mb: 4096         # bounds: (0, 1048576]
    precision_options: ["fp32", "fp16", "int8"]
    default_precision: "fp16"
    delegation_policy: "adaptive" # adaptive | always | never


# -----------------------------------------------------------------------------
# Enhanced composite rules (using advanced metrics)
# -----------------------------------------------------------------------------
# Thresholds are cross-referenced with green_agent_alerts.yml so a
# symbolic violation and the corresponding Prometheus alert fire
# together.
enhanced_composite_rules:

  - id: "ENH-MODP-001"
    name: "Low MODP Score Alert"
    category: "composite"
    priority: "medium"            # was "warning" — not in enum
    condition:
      all_of:
        - { field: "modp_score", op: "<", value: 0.4 }
    for_seconds: 600
    action: "trigger_policy_review"
    explanation: |
      Overall multi-objective performance is poor (MODP < 0.4). Consider
      adjusting weights or policies.
    rationale: "Matches GreenAgentLowMODPScore < 0.4 in green_agent_alerts.yml."
    related_alert: "GreenAgentLowMODPScore"

  - id: "ENH-GRAPH-001"
    name: "Low Graph Centrality"
    category: "composite"
    priority: "info"              # `info` added to priority_order
    condition:
      all_of:
        - { field: "graph_centrality", op: "<", value: 0.3 }
    for_seconds: 600
    action: "check_topology"
    explanation: |
      LIMIT Graph centrality is low — the system may be operating in a
      suboptimal topology.
    rationale: "Matches GreenAgentGraphCentralityLow < 0.3 in green_agent_alerts.yml."
    related_alert: "GreenAgentGraphCentralityLow"

  - id: "ENH-RLHF-001"
    name: "Low Human Feedback Score"
    category: "composite"
    priority: "medium"            # was "warning"
    condition:
      all_of:
        - { field: "human_feedback_score", op: "<", value: 0.3 }
    for_seconds: 900
    action: "collect_more_feedback"
    explanation: |
      Human feedback indicates dissatisfaction — adjust behavior or
      collect more explicit feedback.
    rationale: "Matches GreenAgentLowRLHFFeedback < 0.3 in green_agent_alerts.yml."
    related_alert: "GreenAgentLowRLHFFeedback"

  - id: "ENH-FLEX-001"
    name: "FlexGen Energy Spike"
    category: "composite"
    priority: "medium"            # was "warning"
    condition:
      all_of:
        # v1.1 compared a raw counter (`flexgen_energy_joules > 1000`),
        # which is always true after startup. The new field is a
        # precomputed rate — same semantic as the Prometheus alert.
        - { field: "flexgen_energy_rate_jps", op: ">", value: 1000 }
    for_seconds: 600
    action: "switch_precision"
    explanation: |
      FlexGen energy consumption is high — consider reducing precision
      (fp32 → fp16, or fp16 → int8) to reduce power draw.
    rationale: "Matches GreenAgentFlexGenHighEnergy > 1000 J/s in green_agent_alerts.yml."
    related_alert: "GreenAgentFlexGenHighEnergy"

  # ---------------------------------------------------------------------------
  # New in v2.0 — distillation, MoE, evolutionary, positive reinforcement
  # ---------------------------------------------------------------------------

  - id: "ENH-DISTILL-001"
    name: "Distillation Stalled"
    category: "composite"
    priority: "low"
    condition:
      all_of:
        - { field: "distillation_update_rate_hz", op: "<", value: 0.00056 }
    for_seconds: 1800
    action: "restart_distillation"
    explanation: |
      Distillation has not updated in 30 minutes (rate < 1/1800 Hz).
      Check whether the training loop is active.
    rationale: "Matches GreenAgentDistillationStalled in green_agent_alerts.yml."
    related_alert: "GreenAgentDistillationStalled"

  - id: "ENH-MOE-001"
    name: "MoE Gating Unstable"
    category: "composite"
    priority: "high"
    condition:
      all_of:
        - { field: "moe_gate_stddev_15m", op: ">", value: 0.2 }
    for_seconds: 900
    action: "reset_moe_gating"
    explanation: |
      Gate weight standard deviation over 15 minutes exceeds 0.2 —
      expert routing is unstable. Reset to the prior checkpoint to
      restore stability.
    rationale: "Matches GreenAgentMoEUnstable > 0.2 in green_agent_alerts.yml."
    related_alert: "GreenAgentMoEUnstable"

  - id: "ENH-EVO-001"
    name: "Evolutionary Optimisation Regressed"
    category: "composite"
    priority: "high"
    condition:
      all_of:
        - { field: "evolutionary_delta_fitness_1h", op: "<", value: 0 }
    for_seconds: 1800
    action: "boost_evolutionary_mutation"
    explanation: |
      Evolutionary fitness decreased in the last hour. This is a
      regression — not merely stagnation. Boost mutation to escape the
      local minimum.
    rationale: "Matches GreenAgentEvolutionRegressed < 0 in green_agent_alerts.yml. Stagnation (0 ≤ delta < 0.01) is a separate info rule below."
    related_alert: "GreenAgentEvolutionRegressed"

  - id: "ENH-EVO-002"
    name: "Evolutionary Optimisation Stagnant"
    category: "composite"
    priority: "info"
    condition:
      all_of:
        - { field: "evolutionary_delta_fitness_1h", op: ">=", value: 0 }
        - { field: "evolutionary_delta_fitness_1h", op: "<", value: 0.01 }
    for_seconds: 1800
    action: "boost_evolutionary_mutation"
    explanation: |
      Evolutionary fitness is neither improving nor regressing — it is
      stuck. Boost mutation to escape the plateau.
    rationale: "Matches GreenAgentEvolutionStalled in green_agent_alerts.yml."
    related_alert: "GreenAgentEvolutionStalled"

  - id: "POS-SI-001"
    name: "High Sustainability Index"
    category: "composite"
    priority: "info"
    condition:
      all_of:
        - { field: "sustainability_index", op: ">", value: 0.85 }
    for_seconds: 300
    action: "record_reinforcement"
    explanation: |
      The current run achieved a sustainability index above 0.85 — a
      strong positive example. Record it as a reinforcement signal
      for the distillation replay buffer.
    rationale: "0.85 is roughly the top 10% of runs. High-SI runs are the distillation student's best teaching examples."
    related_alert: ""

  - id: "POS-RLHF-001"
    name: "High Human Feedback"
    category: "composite"
    priority: "info"
    condition:
      all_of:
        - { field: "human_feedback_score", op: ">", value: 0.9 }
    for_seconds: 300
    action: "record_reinforcement"
    explanation: |
      Human feedback above 0.9 — a strong positive signal. Record it
      for distillation.
    rationale: "0.9+ is explicit user satisfaction. High-RLHF runs are the distillation student's other best teaching source."
    related_alert: ""


# -----------------------------------------------------------------------------
# Environment overrides
# -----------------------------------------------------------------------------
environments:
  production:
    enhancements:
      enabled: true

  staging:
    enhancements:
      enabled: true
      flexgen:
        enabled: false

  dev:
    enhancements:
      enabled: false


# =============================================================================
# TEST CASES (used by scripts/validate_symbolic_policy.py and the demo)
# =============================================================================
# Each test case is a snapshot of the engine's metric state plus the set
# of rules that MUST fire (fired:) and MUST NOT fire (not_fired:). The
# validator runs every case and fails if the actual fired set differs.
#
# Add one case per rule; the validator checks that the rule fires on its
# "fired" case and is silent on its "not_fired" case.
_test_cases:

  - name: "SUST-002 fires on energy > 5.0 Wh"
    state:
      energy_wh: 6.0
      carbon_kg: 0.001
      latency_ms: 100
      memory_mb: 200
      tool_calls: 10
    fired: ["SUST-002"]
    not_fired: ["SUST-003", "SUST-001", "RES-001", "RES-002"]

  - name: "SUST-003 fires at 0.002 kg but SUST-001 does not"
    state:
      carbon_kg: 0.01
      energy_wh: 1.0
      latency_ms: 100
      memory_mb: 200
      tool_calls: 10
    fired: ["SUST-003"]
    not_fired: ["SUST-001"]

  - name: "SUST-001 fires on compound carbon + latency"
    state:
      carbon_kg: 0.07
      energy_wh: 1.0
      latency_ms: 3000
      memory_mb: 200
      tool_calls: 10
    fired: ["SUST-003", "SUST-001"]   # SUST-003 also fires — both are true
    not_fired: []

  - name: "RES-001 fires on memory > 500 MB"
    state:
      memory_mb: 600
      energy_wh: 1.0
      carbon_kg: 0.001
      latency_ms: 100
      tool_calls: 10
    fired: ["RES-001"]
    not_fired: ["RES-002"]

  - name: "SAFE-001 fires on error rate > 30%"
    state:
      error_rate_ratio: 0.4
      energy_wh: 1.0
      carbon_kg: 0.001
      latency_ms: 100
      memory_mb: 200
      tool_calls: 10
    fired: ["SAFE-001"]
    not_fired: ["SAFE-002"]

  - name: "ENH-MODP-001 fires on modp_score < 0.4"
    state:
      modp_score: 0.3
      energy_wh: 1.0
      carbon_kg: 0.001
      latency_ms: 100
      memory_mb: 200
      tool_calls: 10
    fired: ["ENH-MODP-001"]
    not_fired: []

  - name: "ENH-MODP-001 does not fire at modp_score = 0.5"
    state:
      modp_score: 0.5
      energy_wh: 1.0
      carbon_kg: 0.001
      latency_ms: 100
      memory_mb: 200
      tool_calls: 10
    fired: []
    not_fired: ["ENH-MODP-001"]

  - name: "COST-001 fires on cost > 0.10 USD"
    state:
      cost_usd: 0.15
      energy_wh: 1.0
      carbon_kg: 0.001
      latency_ms: 100
      memory_mb: 200
      tool_calls: 10
    fired: ["COST-001"]
    not_fired: []

  - name: "COST-001 does not fire on cost = 0.05 USD"
    state:
      cost_usd: 0.05
      energy_wh: 1.0
      carbon_kg: 0.001
      latency_ms: 100
      memory_mb: 200
      tool_calls: 10
    fired: []
    not_fired: ["COST-001"]

  - name: "No rules fire on a clean run"
    state:
      energy_wh: 1.0
      carbon_kg: 0.0001
      latency_ms: 100
      memory_mb: 100
      tool_calls: 5
      error_rate_ratio: 0.0
      accuracy_ratio: 0.9
      cost_usd: 0.001
      pue_factor: 1.2
      modp_score: 0.8
      graph_centrality: 0.8
      human_feedback_score: 0.9
      sustainability_index: 0.9
    fired: []
    not_fired: [
      "SUST-001", "SUST-002", "SUST-003",
      "RES-001", "RES-002", "RES-003",
      "FAIR-001", "FAIR-002",
      "SAFE-001", "SAFE-002",
      "COMP-001", "COMP-002",
      "QUAL-001", "COST-001", "PUE-001",
      "ENH-MODP-001", "ENH-GRAPH-001", "ENH-RLHF-001", "ENH-FLEX-001",
      "ENH-DISTILL-001", "ENH-MOE-001", "ENH-EVO-001", "ENH-EVO-002",
    ]


# =============================================================================
# INVARIANTS (enforced by scripts/validate_symbolic_policy.py)
# =============================================================================
#   1.  _meta.schema_version == version
#   2.  Every `condition.field` ends in a known unit suffix (see UNITS).
#   3.  Every `condition.op` is one of >, >=, <, <=, ==, !=, in, not_in, between.
#   4.  Every `action` is defined in `_actions`.
#   5.  Every rule has `id`, `name`, `category`, `priority`, `condition`,
#       `for_seconds`, `action`, `explanation`.
#   6.  Every `priority` is in `evaluation_config.priority_order`.
#   7.  Every `id` is unique across symbolic_rules, composite_rules,
#       domain_extensions.*, and enhanced_composite_rules.
#   8.  Every `related_alert` (when non-empty) matches an alert name in
#       green_agent_alerts.yml.
#   9.  enhancements.modp.objective_weights sum to 1.0 ± 1e-6 and match
#       agent_config.yaml.modp.objective_weights.
#   10. enhancements.enabled is false at the top level (safe default);
#       environments.production.enhancements.enabled is the opt-in.
#   11. enhancements.rlhf.feedback_url is present iff feedback_source is
#       in {dashboard, api}.
#   12. No rule has a `priority` that fires at a LOWER threshold than a
#       rule of HIGHER priority on the same field. (Priority inversion
#       check.)
#   13. Every `_test_cases` entry fires exactly the rules in `fired:` and
#       none of the rules in `not_fired:`.
#   14. Every `_test_cases` entry references a state field that appears
#       in at least one rule condition.
# =============================================================================


