# Symbolic Policy Rules for Green Agent
# Extends green_policy.yaml with explicit symbolic constraints
# Enhanced with advanced modules: LIMIT Graph, MODP, RLHF,
# Multi‑Teacher On‑Policy Distillation, Bio‑inspired Optimisation,
# MoE expert gating, and FlexGen integration.

version: "1.1"

# ---------------------------------------------------------------------------
# Original symbolic rules (unchanged)
# ---------------------------------------------------------------------------
symbolic_rules:
  # Sustainability Rules
  - id: "SUST-001"
    name: "Carbon Threshold Violation"
    category: "sustainability"
    priority: "high"
    condition: "carbon > 60 AND latency > 2000"
    action: "flag_inefficiency"
    explanation: "High carbon footprint combined with high latency indicates inefficient execution"
    
  - id: "SUST-002"
    name: "Energy Budget Exceeded"
    category: "sustainability"
    priority: "critical"
    condition: "energy > 5.0"
    action: "halt_execution"
    explanation: "Energy consumption exceeds maximum allowed budget"
    
  - id: "SUST-003"
    name: "Carbon Efficiency Warning"
    category: "sustainability"
    priority: "medium"
    condition: "carbon > 0.002"
    action: "trigger_optimization"
    explanation: "Carbon emissions approaching policy limit"
  
  # Resource Management Rules
  - id: "RES-001"
    name: "Memory Overflow Risk"
    category: "resource"
    priority: "critical"
    condition: "memory > 500"
    action: "trigger_resource_alert"
    explanation: "Memory usage exceeds safe threshold"
    
  - id: "RES-002"
    name: "Latency Degradation"
    category: "resource"
    priority: "high"
    condition: "latency > 120000"
    action: "optimize_execution"
    explanation: "Execution latency exceeds acceptable limits"
    
  - id: "RES-003"
    name: "Tool Call Explosion"
    category: "resource"
    priority: "medium"
    condition: "tool_calls > 50"
    action: "reduce_tool_usage"
    explanation: "Excessive tool calls may indicate inefficient planning"
  
  # Fairness Rules
  - id: "FAIR-001"
    name: "Resource Distribution Imbalance"
    category: "fairness"
    priority: "medium"
    condition: "energy_variance > 2.0"
    action: "balance_resources"
    explanation: "Uneven resource distribution across queries detected"
    
  - id: "FAIR-002"
    name: "Query Latency Disparity"
    category: "fairness"
    priority: "low"
    condition: "latency_std_dev > 30000"
    action: "normalize_latency"
    explanation: "Significant latency variation between queries"
  
  # Safety Rules
  - id: "SAFE-001"
    name: "Cascading Failure Risk"
    category: "safety"
    priority: "critical"
    condition: "error_rate > 0.3"
    action: "emergency_stop"
    explanation: "High error rate indicates system instability"
    
  - id: "SAFE-002"
    name: "Resource Leak Detection"
    category: "safety"
    priority: "high"
    condition: "memory_growth_rate > 50"
    action: "investigate_leak"
    explanation: "Rapid memory growth suggests potential resource leak"
  
  # Compliance Rules
  - id: "COMP-001"
    name: "ESG Compliance Violation"
    category: "compliance"
    priority: "critical"
    condition: "carbon > 0.002 AND energy > 5.0"
    action: "compliance_alert"
    explanation: "Multiple ESG thresholds exceeded simultaneously"
    
  - id: "COMP-002"
    name: "Audit Trail Requirement"
    category: "compliance"
    priority: "medium"
    condition: "policy_violation_count > 0"
    action: "generate_audit_trace"
    explanation: "Policy violations require formal audit documentation"

# Composite Rules - Complex logical combinations
composite_rules:
  - id: "COMP-SUST-001"
    name: "Inefficient High-Impact Execution"
    category: "composite"
    priority: "critical"
    condition: "(carbon > 0.0015 OR energy > 4.0) AND latency > 100000 AND tool_calls > 30"
    action: "comprehensive_optimization"
    explanation: "Multiple inefficiency indicators detected simultaneously"
    
  - id: "COMP-RES-001"
    name: "Resource Exhaustion Pattern"
    category: "composite"
    priority: "high"
    condition: "memory > 400 AND cpu_percent > 80 AND latency > 90000"
    action: "resource_throttling"
    explanation: "System approaching resource exhaustion"

# Domain-Specific Extensions
domain_extensions:
  # Research domain
  research:
    - id: "RES-DOMAIN-001"
      condition: "query_type == 'research' AND tool_calls > 100"
      action: "optimize_research_strategy"
      explanation: "Research queries should use efficient search strategies"
  
  # Production domain
  production:
    - id: "PROD-DOMAIN-001"
      condition: "environment == 'production' AND carbon > 0.001"
      action: "strict_carbon_enforcement"
      explanation: "Production environments require stricter carbon limits"

# Rule Evaluation Configuration
evaluation_config:
  # When to evaluate rules
  evaluation_triggers:
    - "step_completion"
    - "reflection_checkpoint"
    - "policy_violation"
    - "manual_trigger"
  
  # Rule evaluation order
  priority_order:
    - "critical"
    - "high"
    - "medium"
    - "low"
  
  # Violation handling
  violation_handling:
    log_all_violations: true
    generate_traces: true
    store_with_pareto: true
    dashboard_alerts: true
    
  # Trace generation
  trace_config:
    include_rule_details: true
    include_metric_snapshot: true
    include_historical_context: true
    format: "structured_json"

# ---------------------------------------------------------------------------
# Advanced Enhancements Section (NEW)
# These settings align the symbolic rules with advanced modules.
# ---------------------------------------------------------------------------

enhancements:
  enabled: true          # Master switch

  # LIMIT Graph integration
  limit_graph:
    enabled: true
    # Graph metrics used in composite rules (centrality, connectivity)
    graph_metrics:
      centrality: 0.7
      connectivity: 0.6
    # How graph metrics influence policy decisions (e.g., weight in rules)
    influence_weight: 0.3

  # MODP (Multi‑Objective Decision Process) weights
  modp:
    enabled: true
    objective_weights: [0.4, 0.3, 0.2, 0.1]   # accuracy, energy, latency, carbon
    normalize_weights: true
    # MODP score can be used in rules: e.g., modp_score < threshold
    score_threshold_low: 0.4
    score_threshold_high: 0.7

  # RLHF (Reinforcement Learning from Human Feedback)
  rlhf:
    enabled: true
    human_feedback_score: 0.6      # default human feedback (0-1)
    feedback_source: "dashboard"
    collect_feedback: true

  # Multi‑Teacher On‑Policy Distillation with MoE gating
  distillation:
    enabled: true
    use_moe_gating: true
    distillation_lr: 0.01
    gating_lr: 0.005
    replay_size: 2000
    train_every: 10
    epsilon: 0.1
    teachers:
      - "rule_based"
      - "historical_ml"
      - "q_learning"
      - "rlhf"

  # Bio‑inspired Optimisation (Evolutionary)
  bio_inspired:
    enabled: true
    use_evolutionary: true
    population_size: 20
    mutation_rate: 0.1
    crossover_rate: 0.7
    elitism: 2

  # MoE expert gating details
  moe_expert:
    enabled: true
    n_experts: 4
    gating_lr: 0.005

  # FlexGen integration (optional high‑throughput LLM execution)
  flexgen:
    enabled: true
    model_name: "facebook/opt-6.7b"
    batch_size: 16
    memory_limit_mb: 4096
    precision_options: ["fp32", "fp16", "int8"]
    default_precision: "fp16"
    delegation_policy: "adaptive"   # adaptive | always | never

# New composite rules that use advanced metrics
enhanced_composite_rules:
  - id: "ENH-MODP-001"
    name: "Low MODP Score Alert"
    priority: "warning"
    condition: "modp_score < 0.4"
    action: "trigger_policy_review"
    explanation: "Overall multi‑objective performance is poor; consider adjusting weights or policies."

  - id: "ENH-GRAPH-001"
    name: "Low Graph Centrality"
    priority: "info"
    condition: "graph_centrality < 0.3"
    action: "check_topology"
    explanation: "LIMIT Graph centrality is low; system may be operating in a suboptimal topology."

  - id: "ENH-RLHF-001"
    name: "Low Human Feedback Score"
    priority: "warning"
    condition: "human_feedback_score < 0.3"
    action: "collect_more_feedback"
    explanation: "Human feedback indicates dissatisfaction; consider adjusting behavior or prompting."

  - id: "ENH-FLEX-001"
    name: "FlexGen Energy Spike"
    priority: "warning"
    condition: "flexgen_energy_joules > 1000"
    action: "switch_precision"
    explanation: "FlexGen energy consumption is high; consider using lower precision (fp16/int8)."
