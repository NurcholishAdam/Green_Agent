# .github/workflows/build-and-push.yml
#
# Green Agent v5.0.0 — Build & Push to GHCR
# ==========================================
#
# | Field | Value |
# |---|---|
# | Version | 5.0.0 |
# | Last Updated | 2026-11-16 |
# | Status | Production Ready |
# | Trigger | push to `main` · `v*` tags · PR to `main` · manual |
# | Output | immutable `ghcr.io/nurcholishadam/green-agent:<tag>` |
#
# ── What this workflow does ───────────────────────────────────────────────
#   1. Validates `agentbeats.json` (schema + `.image` matches this build)
#   2. Guards required files (Dockerfile, src/, symbolic_policy.yaml, …)
#   3. Builds via `docker/build-push-action@v6` with GHA layer cache
#   4. Verifies the image (non-root + imports + `agentbeats.json` baked in)
#   5. Logs in to GHCR **only after** verification passes
#   6. Pushes the image and captures the immutable digest
#   7. Emits digest + pull command in the job summary
#   8. Uploads `agentbeats.json` as a provenance artifact
#
# ── Bugs fixed vs. the previous version ──────────────────────────────────
#   • **Removed orphan `docker load < green-agent.tar`** — it was inside
#     `with:` and has no colon, which is invalid YAML. The workflow was
#     rejected before any step ran. It also contradicted `push: true`.
#   • **`file: Dockerfile.benchmark` → `file: Dockerfile`** — the
#     benchmark Dockerfile does not exist anywhere in the repo.
#   • **`context:` empty → `context: .`** — was ambiguous.
#   • **`docker/build-push-action@v5` → `@v6`** — v5 lacks
#     `provenance`/`sbom` controls that break `docker save` downstream.
#   • **Image name `green_agent` (underscore) → `green-agent` (hyphen)** —
#     the underscore variant publishes to a *separate* GHCR repo that
#     every other workflow (and the Dockerfile) does not reference.
#   • **`:latest` + `:main` (mutable) → immutable tags** — AgentBeats
#     requires immutable submission images. Mutable tags mean two
#     reviewers pulling `:latest` at different times get different images.
#     Now: `:5.0.0`, `:<git-tag>`, `:sha-<hash>`, and `:latest` only on
#     `main` (with a warning if `agentbeats.json` references it).
#
# ── Why verify → login → push (not build → login → push) ────────────────
#   The previous order let broken images reach GHCR (missing `src/`,
#   wrong user, failed import). Reviewers found out only when they
#   `docker pull && docker run`. Now nothing reaches GHCR until the
#   verification step passes.
#
# ── Required repository permissions ──────────────────────────────────────
#   Settings → Actions → General → Workflow permissions:
#     ✅ Read and write permissions
#
# ── Required `agentbeats.json` fields ────────────────────────────────────
#   {
#     "name":        "green-agent",                              # string
#     "version":     "5.0.0",                                    # semver
#     "image":       "ghcr.io/nurcholishadam/green-agent:5.0.0", # immutable
#     "entrypoint":  ["python", "run_agent.py"],                 # array
#     "description": "..."                                       # string
#   }
#
# ── Changelog ────────────────────────────────────────────────────────────
#   5.0.0 (2026-11-16)
#     Fixed:
#       • Removed orphan `docker load < green-agent.tar` (YAML parse error)
#       • `Dockerfile.benchmark` → `Dockerfile`
#       • `context:` empty → `context: .`
#       • `build-push-action@v5` → `@v6`
#       • `green_agent` (underscore) → `green-agent` (hyphen)
#       • Mutable `:latest` / `:main` → immutable version/SHA tags
#       • Reordered to validate → build → verify → login → push
#     Added:
#       • `agentbeats.json` schema validation + tag↔image match
#       • Required-file guards (Dockerfile, src/, symbolic_policy.yaml, …)
#       • Explicit build args (PYTHON_IMAGE, BUILD_VERSION, BUILD_DATE, …)
#       • GHA layer cache
#       • `platforms: linux/amd64` explicit
#       • `provenance: false` + `sbom: false`
#       • Non-root + import + agentbeats-in-image verification
#       • `workflow_dispatch` (manual re-run)
#       • `pull_request` trigger (verify-only)
#       • `concurrency`, `timeout-minutes: 20`
#       • Image digest in job summary + `$GITHUB_OUTPUT`
#       • `agentbeats.json` uploaded as artifact (90-day retention)
#       • Cleanup step (frees runner disk)
#
# ── What's Not in Scope ──────────────────────────────────────────────────
#   • Multi-arch manifest (linux/arm64) — AgentBeats runs amd64.
#   • Cosign signing / SLSA attestation — add `id-token: write` + step.
#   • AgentBeats submission API call — publish only.
#   • Automatic version bumping — driven by git tag / agentbeats.json.

name: Build & Push Green Agent (AgentBeats)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build + verify only — do NOT push to GHCR'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# ── Least-privilege permissions ──────────────────────────────────────────
permissions:
  contents: read
  packages: write
  # id-token: write         # uncomment when adding cosign signing
  # attestations: write     # uncomment when adding SLSA provenance

# ── Cancel in-progress runs on the same ref ──────────────────────────────
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tag-pinned — always resolves. Re-pin to a digest only after verifying:
  #   docker buildx imagetools inspect python:3.12.3-slim
  PYTHON_IMAGE: python:3.12.3-slim
  AGENTBEATS_FILE: agentbeats.json
  # GHCR image base (hyphen, matches Dockerfile + other workflows)
  IMAGE_NAME: ghcr.io/nurcholishadam/green-agent

jobs:
  docker:
    name: Build · Verify · Push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ═══════════════════════════════════════════════════════════════════
      # 1. Checkout
      # ═══════════════════════════════════════════════════════════════════
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ═══════════════════════════════════════════════════════════════════
      # 2. Validate agentbeats.json
      # ═══════════════════════════════════════════════════════════════════
      - name: Validate agentbeats.json
        id: agentbeats
        run: |
          set -euo pipefail

          if [ ! -f "${AGENTBEATS_FILE}" ]; then
            echo "::error::${AGENTBEATS_FILE} not found at repo root"
            exit 1
          fi

          # 2a. JSON syntax
          echo "▶ [2a] Checking JSON syntax…"
          jq . "${AGENTBEATS_FILE}" > /dev/null
          echo "  ✓ JSON valid"

          # 2b. Required fields present and non-null
          echo "▶ [2b] Checking required fields…"
          for field in name version image entrypoint description; do
            if ! jq -e --arg f "$field" 'has($f) and (.[$f] != null)' "${AGENTBEATS_FILE}" > /dev/null; then
              echo "::error::${AGENTBEATS_FILE} is missing required field: ${field}"
              exit 1
            fi
            echo "  ✓ .${field}"
          done

          # 2c. Field types
          echo "▶ [2c] Checking field types…"
          if ! jq -e '.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+")' "${AGENTBEATS_FILE}" > /dev/null; then
            echo "::error::.version must be semver (e.g. 5.0.0)"
            exit 1
          fi
          if ! jq -e '.entrypoint | type == "array" and length > 0' "${AGENTBEATS_FILE}" > /dev/null; then
            echo "::error::.entrypoint must be a non-empty array"
            exit 1
          fi
          echo "  ✓ All field types valid"

          # 2d. Extract values for downstream
          AB_VERSION="$(jq -er '.version' "${AGENTBEATS_FILE}")"
          AB_IMAGE="$(jq -er '.image'   "${AGENTBEATS_FILE}")"
          echo "  agentbeats.version = ${AB_VERSION}"
          echo "  agentbeats.image   = ${AB_IMAGE}"

          {
            echo "version=${AB_VERSION}"
            echo "image=${AB_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════════════
      # 3. Compute tags (immutable by default, :latest only on main)
      # ═══════════════════════════════════════════════════════════════════
      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail

          AB_VERSION="${{ steps.agentbeats.outputs.version }}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          REF_NAME="${GITHUB_REF_NAME}"

          tags="${IMAGE_NAME}:${AB_VERSION}"
          tags="${tags}"$'\n'"${IMAGE_NAME}:sha-${SHA_SHORT}"

          # On tag push (v*): use the tag itself
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${REF_NAME}"
          fi

          # :latest only on main branch push
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
          fi

          # Primary tag = version (used for verification + agentbeats.json match)
          primary_tag="${IMAGE_NAME}:${AB_VERSION}"

          echo "Tags to push:"
          echo "${tags}" | sed 's/^/  /'
          echo "Primary tag: ${primary_tag}"

          {
            echo "list<<EOF"
            echo "${tags}"
            echo "EOF"
            echo "primary=${primary_tag}"
          } >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════════════
      # 4. Cross-check agentbeats.json .image ↔ primary tag
      # ═══════════════════════════════════════════════════════════════════
      - name: Cross-check agentbeats.json .image
        run: |
          set -euo pipefail

          AB_IMAGE="${{ steps.agentbeats.outputs.image }}"
          PRIMARY="${{ steps.tags.outputs.primary }}"

          if [ "${AB_IMAGE}" != "${PRIMARY}" ]; then
            echo "::warning::agentbeats.json .image (${AB_IMAGE}) does not match primary tag (${PRIMARY})"
            echo "          Reviewers pulling .image will not get this build."
          else
            echo "✓ agentbeats.json .image matches primary tag"
          fi

          # Reject mutable tags — AgentBeats requires immutable submission images
          AB_TAG="${AB_IMAGE##*:}"
          if [[ "${AB_TAG}" =~ ^(latest|main|master|dev|stable|edge|test)$ ]]; then
            echo "::error::agentbeats.json .image uses a mutable tag (${AB_TAG})"
            echo "          AgentBeats requires immutable tags (version or git SHA)"
            exit 1
          fi

      # ═══════════════════════════════════════════════════════════════════
      # 5. Guard required files
      # ═══════════════════════════════════════════════════════════════════
      - name: Guard required files
        run: |
          set -euo pipefail

          required=(
            Dockerfile
            requirements.txt
            run_agent.py
            symbolic_policy.yaml
            agentbeats.json
            src/symbolic/symbolic_reasoning_engine.py
            src/policy/policy_feedback.py
            src/enhancements/__init__.py
            test_symbolic_oversight.py
          )

          for f in "${required[@]}"; do
            if [ ! -f "${f}" ] && [ ! -d "${f}" ]; then
              echo "::error::Required file or directory missing: ${f}"
              exit 1
            fi
            echo "  ✓ ${f}"
          done

          echo "✓ All required files present"

      # ═══════════════════════════════════════════════════════════════════
      # 6. Set up Docker Buildx
      # ═══════════════════════════════════════════════════════════════════
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # ═══════════════════════════════════════════════════════════════════
      # 7. Build image (loaded into daemon — verify BEFORE login/push)
      # ═══════════════════════════════════════════════════════════════════
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ steps.agentbeats.outputs.version }}
            ENHANCEMENTS_ENABLED=true
          tags: |
            ${{ steps.tags.outputs.primary }}
            green-agent:build-verify
          cache-from: type=gha,scope=build-push
          cache-to: type=gha,mode=max,scope=build-push

      # ═══════════════════════════════════════════════════════════════════
      # 8. Verify image — non-root + imports + agentbeats.json baked in
      # ═══════════════════════════════════════════════════════════════════
      - name: Verify image
        run: |
          set -euo pipefail

          VERIFY_TAG="green-agent:build-verify"

          # 8a. Non-root user
          echo "▶ [8a] Checking non-root user…"
          uid=$(docker run --rm "${VERIFY_TAG}" id -u)
          if [ "${uid}" = "0" ]; then
            echo "::error::Image runs as root (uid=0)"
            exit 1
          fi
          echo "  ✓ Runs as uid=${uid}"

          # 8b. Core imports
          echo "▶ [8b] Checking core imports…"
          docker run --rm "${VERIFY_TAG}" python -c "
          import src
          from src.symbolic.symbolic_reasoning_engine import SymbolicReasoningEngine
          from src.policy.policy_feedback import PolicyFeedback
          from src.enhancements.schemas.node_descriptor import NodeDescriptor
          from src.enhancements.schemas.workload_descriptor import WorkloadDescriptor
          print('  ✓ all core imports OK')
          "

          # 8c. Entrypoint module importable
          echo "▶ [8c] Checking entrypoint module…"
          docker run --rm "${VERIFY_TAG}" python -c "
          import importlib.util
          spec = importlib.util.find_spec('run_agent')
          assert spec is not None, 'run_agent.py not importable'
          print('  ✓ run_agent module found')
          "

          # 8d. agentbeats.json baked in
          echo "▶ [8d] Checking agentbeats.json is baked in…"
          docker run --rm "${VERIFY_TAG}" test -f agentbeats.json
          echo "  ✓ agentbeats.json present in image"

          echo "✓ Image verified"

      # ═══════════════════════════════════════════════════════════════════
      # 9. Run symbolic test suite (advisory — does not block push)
      # ═══════════════════════════════════════════════════════════════════
      - name: Run symbolic test suite (advisory)
        continue-on-error: true
        run: |
          echo "Running test_symbolic_oversight.py inside the image…"
          docker run --rm green-agent:build-verify python test_symbolic_oversight.py || {
            echo "::warning::Some tests failed — see logs. Not blocking the push."
            echo "The image is still usable; fix the failing rules in a follow-up."
          }

      # ═══════════════════════════════════════════════════════════════════
      # 10. Login to GHCR (only after verification)
      # ═══════════════════════════════════════════════════════════════════
      - name: Login to GHCR
        if: |
          github.event_name == 'push'
          && github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ═══════════════════════════════════════════════════════════════════
      # 11. Push image (all computed tags)
      # ═══════════════════════════════════════════════════════════════════
      - name: Push image
        id: push
        if: |
          github.event_name == 'push'
          && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail

          PRIMARY="${{ steps.tags.outputs.primary }}"
          echo "▶ Pushing ${PRIMARY} and additional tags…"

          # Tag the verified image with every computed tag, then push each
          while IFS= read -r tag; do
            [ -z "${tag}" ] && continue
            docker tag "${PRIMARY}" "${tag}"
            echo "  → docker push ${tag}"
            docker push "${tag}"
          done <<< "${{ steps.tags.outputs.list }}"

          # Capture the immutable digest of the primary tag
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${PRIMARY}")"
          echo "✓ Pushed: ${DIGEST}"

          {
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════════════
      # 12. Upload agentbeats.json as provenance artifact
      # ═══════════════════════════════════════════════════════════════════
      - name: Upload agentbeats.json
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentbeats-${{ steps.agentbeats.outputs.version || 'unknown' }}
          path: |
            agentbeats.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
          compression-level: 6

      # ═══════════════════════════════════════════════════════════════════
      # 13. Job summary
      # ═══════════════════════════════════════════════════════════════════
      - name: Write job summary
        if: always()
        run: |
          PRIMARY="${{ steps.tags.outputs.primary || 'n/a' }}"
          AB_IMAGE="${{ steps.agentbeats.outputs.image || 'n/a' }}"
          AB_VERSION="${{ steps.agentbeats.outputs.version || 'n/a' }}"
          DIGEST="${{ steps.push.outputs.digest || 'not-pushed' }}"
          TRIGGER="${{ github.event_name }}"
          REF="${{ github.ref_name }}"
          SHA="${GITHUB_SHA:0:7}"

          {
            echo "## Green Agent — Build & Push Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${TRIGGER}\` |"
            echo "| Ref | \`${REF}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo "| Primary image | \`${PRIMARY}\` |"
            echo "| agentbeats.json .image | \`${AB_IMAGE}\` |"
            echo "| agentbeats.json .version | \`${AB_VERSION}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo ""
            if [ "${DIGEST}" = "not-pushed" ]; then
              echo "> ⚠️ Image was **not pushed** (PR or dry-run). Build + verify only."
            else
              echo "### Pull command"
              echo '```bash'
              echo "docker pull ${DIGEST}"
              echo '```'
            fi
            echo ""
            echo "### Required \`agentbeats.json\` shape"
            echo '```json'
            echo '{'
            echo '  "name": "green-agent",'
            echo '  "version": "5.0.0",'
            echo '  "image": "ghcr.io/nurcholishadam/green-agent:5.0.0",'
            echo '  "entrypoint": ["python", "run_agent.py"],'
            echo '  "description": "Green Agent v5.0.0 — 4-layer feedback architecture"'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ═══════════════════════════════════════════════════════════════════
      # 14. Cleanup local images
      # ═══════════════════════════════════════════════════════════════════
      - name: Cleanup local images
        if: always()
        run: |
          docker rmi "${{ steps.tags.outputs.primary }}" 2>/dev/null || true
          docker rmi green-agent:build-verify 2>/dev/null || true
