# .github/workflows/build-ghcr.yml
#
# Green Agent — Docker Build & Export
# ===================================
#
# Builds and verifies the Green Agent image, then optionally exports it
# as a downloadable tar.gz artifact.
#
# This workflow does not publish to GHCR; use build-docker.yaml for that.

name: Docker Build & Export

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      export_image:
        description: 'Export the built image as a tar.gz artifact'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      enhancements_enabled:
        description: 'Enable enhancement modules'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: docker-export-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_IMAGE: python:3.12.3-slim
  IMAGE_NAME: green-agent

jobs:
  build:
    name: Build and verify image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHA_SHORT="${GITHUB_SHA:0:7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${SHA_SHORT}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Green Agent version: ${VERSION}"

      - name: Validate base image reference
        shell: bash
        run: |
          set -euo pipefail

          image="${PYTHON_IMAGE}"
          echo "Base image: ${image}"

          if [[ "${image}" =~ (REPLACE_ME|TODO|PLACEHOLDER|CHANGEME) ]]; then
            echo "::error::PYTHON_IMAGE contains a placeholder: ${image}"
            exit 1
          fi

          if [[ "${image}" == *@sha256:* ]]; then
            digest="${image##*@sha256:}"

            if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Malformed sha256 digest: ${digest}"
              exit 1
            fi

            echo "✓ Digest format valid"
          else
            echo "✓ Using tag-pinned base image"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            ENHANCEMENTS_ENABLED=${{ github.event.inputs.enhancements_enabled || 'true' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:build-verify
          cache-from: type=gha,scope=green-agent-export
          cache-to: type=gha,mode=max,scope=green-agent-export

      - name: Verify image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:build-verify"

          echo "▶ Verifying non-root runtime"
          uid="$(docker run --rm "${IMAGE}" id -u)"

          if [[ "${uid}" == "0" ]]; then
            echo "::error::Container runs as root (uid=0)"
            exit 1
          fi

          echo "✓ Container runs as non-root (uid=${uid})"

          echo "▶ Verifying Green core imports"
          docker run --rm "${IMAGE}" python - <<'PY'
          import src
          from src.symbolic.symbolic_reasoning_engine import SymbolicReasoningEngine
          from src.policy.policy_feedback import PolicyFeedback
          from src.enhancements.schemas.node_descriptor import NodeDescriptor
          from src.enhancements.schemas.workload_descriptor import WorkloadDescriptor

          print("✓ Green core imports OK")
          PY

      - name: Run symbolic test suite
        continue-on-error: true
        shell: bash
        run: |
          echo "▶ Running symbolic oversight tests"
          docker run --rm "${IMAGE_NAME}:build-verify" python test_symbolic_oversight.py || {
            echo "::warning::One or more symbolic tests failed. See logs above."
          }

      - name: Export image artifact
        if: github.event.inputs.export_image != 'false'
        id: export
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.meta.outputs.version }}"
          FILENAME="green-agent-${VERSION}-linux-amd64.tar.gz"
          OUTPUT="/tmp/${FILENAME}"

          echo "▶ Exporting ${IMAGE_NAME}:${VERSION}"
          docker save "${IMAGE_NAME}:${VERSION}" | gzip -9 > "${OUTPUT}"

          SIZE="$(stat -c%s "${OUTPUT}")"

          if (( SIZE < 5000000 )); then
            echo "::error::Exported image is suspiciously small: ${SIZE} bytes"
            exit 1
          fi

          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          echo "✓ Exported ${FILENAME} ($(du -h "${OUTPUT}" | cut -f1))"

      - name: Upload image artifact
        if: github.event.inputs.export_image != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.export.outputs.filename }}
          path: /tmp/${{ steps.export.outputs.filename }}
          retention-days: 30
          overwrite: true
          if-no-files-found: error
          compression-level: 0

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version || 'unknown' }}"
          EXPORTED="${{ steps.export.outputs.filename || 'not-exported' }}"

          {
            echo "## Green Agent Docker build summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | `${{ github.event_name }}` |"
            echo "| Ref | `${{ github.ref_name }}` |"
            echo "| Commit | `${GITHUB_SHA:0:7}` |"
            echo "| Version | `${VERSION}` |"
            echo "| Base image | `${PYTHON_IMAGE}` |"
            echo "| Exported artifact | `${EXPORTED}` |"
            echo ""

            if [[ "${EXPORTED}" != "not-exported" ]]; then
              echo "### Load the image locally"
              echo '```bash'
              echo "docker load -i ${EXPORTED}"
              echo "docker run --rm green-agent:${VERSION} python test_symbolic_oversight.py"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up local images
        if: always()
        shell: bash
        run: |
          set +e

          docker rmi "${IMAGE_NAME}:${{ steps.meta.outputs.version }}" 2>/dev/null || true
          docker rmi "${IMAGE_NAME}:build-verify" 2>/dev/null || true
