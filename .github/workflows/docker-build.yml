# .github/workflows/build-and-push.yml
#
# Green Agent v5.0.0 — Build & Push to GHCR (single source of truth)
# =================================================================
#
# | Field | Value |
# |---|---|
# | Version | 5.0.0 |
# | Last Updated | 2026-11-16 |
# | Status | Production Ready |
# | Trigger | manual dispatch only |
# | Output | verified local image; no registry push |
#
# ── Manual compatibility workflow ────────────────────────────────────────
# Automated image builds and GHCR publishing are handled by
# `build-docker.yaml`. This older workflow is retained for manual build
# verification only and must not publish a second image on every push.
#
# ── What this workflow does ───────────────────────────────────────────────
#   1. Validates `agentbeats.json` (schema + `.image` tag immutability)
#   2. Guards required files (Dockerfile, src/, symbolic_policy.yaml, …)
#   3. Builds via `docker/build-push-action@v6` with GHA layer cache
#   4. Verifies the image (non-root + imports + `agentbeats.json` baked in)
#   5. Logs in to GHCR **only after** verification passes
#   6. Pushes the image and captures the immutable digest
#   7. Emits digest + pull command in the job summary
#   8. Uploads `agentbeats.json` as a provenance artifact
#
# ── Canonical image name ──────────────────────────────────────────────────
#   `green-agent` (hyphen) — matches:
#     • Dockerfile `LABEL org.opencontainers.image.title="green-agent"`
#     • config/base/*.yaml (all resource names)
#     • agentbeats-submission.yml v5.0.0 examples
#     • This workflow's IMAGE_NAME env var
#
#   NOT `green_agent` (underscore) — that was the name in the deleted
#   workflow and published to a separate GHCR repo that nothing else
#   referenced.
#
# ── Case handling (the `toLower()` bug) ──────────────────────────────────
#   GitHub Actions has NO `toLower()` / `toUpperCase()` expression functions.
#   The previous workflow used `${{ toLower(github.repository) }}` which the
#   expression engine rejects at validation time.
#
#   This workflow uses a **shell step** to lowercase the repository name:
#     REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
#
#   The canonical image name is also hardcoded (`IMAGE_NAME` env var) so
#   the repo name from `github.repository` is never used directly. The
#   lowercase step is only kept as a fallback for forks.
#
# ── Why immutable tags (not `:main` / `:latest` only) ────────────────────
#   AgentBeats reviewers pull submission images at arbitrary times. A
#   mutable `:main` or `:latest` means different reviewers get different
#   images from the same "submission". `agentbeats-submission.yml` v5.0.0
#   explicitly rejects these tags. This workflow emits:
#     • :5.0.0            (semver from agentbeats.json)
#     • :v5.0.0           (git tag, on tag push)
#     • :sha-<short>      (immutable commit SHA)
#     • :latest           (main branch only, for convenience)
#
# ── Why verify → login → push (not build → login → push) ────────────────
#   The previous order let broken images reach GHCR (missing `src/`,
#   wrong user, failed import). Reviewers found out only when they
#   `docker pull && docker run`. Now nothing reaches GHCR until the
#   verification step passes.
#
# ── Required repository permissions ──────────────────────────────────────
#   Settings → Actions → General → Workflow permissions:
#   This verification-only workflow needs no package write permission.
#
# ── Required `agentbeats.json` fields ────────────────────────────────────
#   {
#     "name":        "green-agent",                              # string
#     "version":     "5.0.0",                                    # semver
#     "image":       "ghcr.io/<owner>/green-agent:5.0.0",        # immutable
#     "entrypoint":  ["python", "run_agent.py"],                 # array
#     "description": "..."                                       # string
#   }
#
# ── Local dry-run ────────────────────────────────────────────────────────
#   export PYTHON_IMAGE="python:3.12.3-slim"
#   docker build \
#     --build-arg PYTHON_IMAGE="$PYTHON_IMAGE" \
#     --build-arg BUILD_VERSION=5.0.0 \
#     --build-arg ENHANCEMENTS_ENABLED=true \
#     -t ghcr.io/nurcholishadam/green-agent:5.0.0 .
#   docker run --rm ghcr.io/nurcholishadam/green-agent:5.0.0 id -u
#   docker run --rm ghcr.io/nurcholishadam/green-agent:5.0.0 python -c \
#     "from src.symbolic.symbolic_reasoning_engine import SymbolicReasoningEngine"
#
# ── Changelog ────────────────────────────────────────────────────────────
#   5.0.0 (2026-11-16)
#     Consolidated:
#       • Replaces the deleted `docker-build.yml` (which used the
#         non-existent `toLower()` expression function).
#     Fixed:
#       • `toLower(github.repository)` → shell `tr '[:upper:]' '[:lower:]'`
#       • Image name `green_agent` (underscore) → `green-agent` (hyphen)
#       • Mutable `:main` / `:latest` → immutable version + SHA tags
#       • Reordered to validate → build → verify → login → push
#     Added:
#       • `agentbeats.json` schema validation + tag immutability check
#       • Required-file guards (Dockerfile, src/, symbolic_policy.yaml, …)
#       • Explicit build args (PYTHON_IMAGE, BUILD_VERSION, BUILD_DATE, …)
#       • GHA layer cache (`cache-from` / `cache-to: type=gha`)
#       • `platforms: linux/amd64` explicit
#       • `provenance: false` + `sbom: false`
#       • Non-root + import verification before push
#       • `workflow_dispatch` (manual re-run with `dry_run` input)
#       • `pull_request` trigger (verify-only, no push)
#       • `concurrency`, `timeout-minutes: 20`
#       • Image digest in job summary + `$GITHUB_OUTPUT`
#       • `agentbeats.json` uploaded as artifact (90-day retention)
#       • Cleanup step (frees runner disk)
#       • `::group::` / `::error::` annotations
#       • Full header + changelog + "What's Not in Scope" + Reviewer Checklist
#
# ── What's Not in Scope ──────────────────────────────────────────────────
#   • Multi-arch manifest (linux/arm64) — AgentBeats runs amd64.
#   • Cosign signing / SLSA attestation — add `id-token: write` + step.
#   • AgentBeats submission API call — publish only.
#   • Automatic version bumping — driven by git tag / agentbeats.json.
#   • Windows container images — Linux only.

name: Build & Push Green Agent (GHCR)

on:
  workflow_dispatch:
    inputs:
      enhancements_enabled:
        description: 'Enable all enhancement modules'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

# ── Least-privilege permissions ──────────────────────────────────────────
permissions:
  contents: read
  # id-token: write         # uncomment when adding cosign signing
  # attestations: write     # uncomment when adding SLSA provenance

# ── Cancel in-progress runs on the same ref ──────────────────────────────
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

# ── Shared environment ───────────────────────────────────────────────────
env:
  # Tag-pinned — always resolves. Re-pin to a digest only after verifying:
  #   docker buildx imagetools inspect python:3.12.3-slim
  PYTHON_IMAGE: python:3.12.3-slim
  AGENTBEATS_FILE: agentbeats.json
  # Canonical image name (hyphen, matches Dockerfile + all manifests).
  # Hardcoded — does NOT derive from github.repository, so forks and
  # case-variant repo names cannot accidentally publish to a wrong path.
  IMAGE_NAME: ghcr.io/nurcholishadam/green-agent

jobs:
  build:
    name: Build · Verify · Push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ═══════════════════════════════════════════════════════════════════
      # 1. Checkout
      # ═══════════════════════════════════════════════════════════════════
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ═══════════════════════════════════════════════════════════════════
      # 2. Compute lowercase repository name (fork fallback)
      #    GHA has NO toLower() expression function — must use shell.
      #    For this repo (NurcholishAdam/Green_Agent) the canonical name
      #    is hardcoded in IMAGE_NAME above, but this output is used when
      #    a fork wants to push to its own GHCR namespace.
      # ═══════════════════════════════════════════════════════════════════
      - name: Compute lowercase image name (fork fallback)
        id: img
        shell: bash
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "computed=ghcr.io/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "  github.repository → ${{ github.repository }}"
          echo "  lowercase         → ghcr.io/${REPO_LOWER}"
          echo "  canonical         → ${IMAGE_NAME}"

      # ═══════════════════════════════════════════════════════════════════
      # 3. Validate agentbeats.json
      # ═══════════════════════════════════════════════════════════════════
      - name: Validate agentbeats.json
        id: agentbeats
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${AGENTBEATS_FILE}" ]; then
            echo "::error::${AGENTBEATS_FILE} not found at repo root"
            exit 1
          fi

          # 3a. JSON syntax
          echo "::group::JSON syntax"
          jq . "${AGENTBEATS_FILE}" > /dev/null
          echo "  ✓ JSON valid"
          echo "::endgroup::"

          # 3b. Required fields present and non-null
          echo "::group::Required fields"
          for field in name version image entrypoint description; do
            if ! jq -e --arg f "$field" 'has($f) and (.[$f] != null)' "${AGENTBEATS_FILE}" > /dev/null; then
              echo "::error::${AGENTBEATS_FILE} is missing required field: ${field}"
              exit 1
            fi
            echo "  ✓ .${field}"
          done
          echo "::endgroup::"

          # 3c. Field types
          echo "::group::Field types"
          if ! jq -e '.name | type == "string" and length > 0' "${AGENTBEATS_FILE}" > /dev/null; then
            echo "::error::.name must be a non-empty string"
            exit 1
          fi
          if ! jq -e '.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+")' "${AGENTBEATS_FILE}" > /dev/null; then
            echo "::error::.version must be semver (e.g. 5.0.0)"
            exit 1
          fi
          if ! jq -e '.entrypoint | type == "array" and length > 0' "${AGENTBEATS_FILE}" > /dev/null; then
            echo "::error::.entrypoint must be a non-empty array"
            exit 1
          fi
          if ! jq -e '.description | type == "string" and length > 0' "${AGENTBEATS_FILE}" > /dev/null; then
            echo "::error::.description must be a non-empty string"
            exit 1
          fi
          echo "  ✓ all field types valid"
          echo "::endgroup::"

          # 3d. Extract values for downstream
          AB_VERSION="$(jq -er '.version' "${AGENTBEATS_FILE}")"
          AB_IMAGE="$(jq -er '.image'   "${AGENTBEATS_FILE}")"
          echo "  agentbeats.version = ${AB_VERSION}"
          echo "  agentbeats.image   = ${AB_IMAGE}"

          {
            echo "version=${AB_VERSION}"
            echo "image=${AB_IMAGE}"
          } >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════════════
      # 4. Compute tags (immutable by default, :latest only on main)
      # ═══════════════════════════════════════════════════════════════════
      - name: Compute tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          AB_VERSION="${{ steps.agentbeats.outputs.version }}"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          REF_NAME="${GITHUB_REF_NAME}"

          tags="${IMAGE_NAME}:${AB_VERSION}"
          tags="${tags}"$'\n'"${IMAGE_NAME}:sha-${SHA_SHORT}"

          # On tag push (v*): use the tag itself
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:${REF_NAME}"
          fi

          # :latest only on main branch push
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
          fi

          # Primary tag = version (used for verification + agentbeats.json match)
          primary_tag="${IMAGE_NAME}:${AB_VERSION}"

          echo "::group::Tags to push"
          echo "${tags}" | sed 's/^/  /'
          echo "  primary: ${primary_tag}"
          echo "::endgroup::"

          {
            echo "list<<EOF"
            echo "${tags}"
            echo "EOF"
            echo "primary=${primary_tag}"
            echo "sha_tag=${IMAGE_NAME}:sha-${SHA_SHORT}"
          } >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════════════════════════════
      # 5. Cross-check agentbeats.json .image ↔ primary tag
      # ═══════════════════════════════════════════════════════════════════
      - name: Cross-check agentbeats.json .image
        shell: bash
        run: |
          set -euo pipefail

          AB_IMAGE="${{ steps.agentbeats.outputs.image }}"
          PRIMARY="${{ steps.tags.outputs.primary }}"

          if [ "${AB_IMAGE}" != "${PRIMARY}" ]; then
            echo "::warning::agentbeats.json .image (${AB_IMAGE}) does not match primary tag (${PRIMARY})"
            echo "          Reviewers pulling .image will not get this build."
          else
            echo "✓ agentbeats.json .image matches primary tag"
          fi

          # Reject mutable tags — AgentBeats requires immutable submission images
          AB_TAG="${AB_IMAGE##*:}"
          if [[ "${AB_TAG}" =~ ^(latest|main|master|dev|stable|edge|test|canary|nightly)$ ]]; then
            echo "::error::agentbeats.json .image uses a mutable tag (${AB_TAG})"
            echo "          AgentBeats requires immutable tags (version or git SHA)"
            exit 1
          fi
          echo "✓ agentbeats.json .image tag is immutable"

      # ═══════════════════════════════════════════════════════════════════
      # 6. Guard required files
      # ═══════════════════════════════════════════════════════════════════
      - name: Guard required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            Dockerfile
            config/base/green_agent_config.yaml
            requirements.txt
            run_agent.py
            symbolic_policy.yaml
            agentbeats.json
            quantum_integration/quantum-limit-graph-v2.4.0/limit-agentbench/src/symbolic/symbolic_reasoning_engine.py
            quantum_integration/quantum-limit-graph-v2.4.0/limit-agentbench/src/policy/policy_feedback.py
            quantum_integration/quantum-limit-graph-v2.4.0/limit-agentbench/src/enhancements/__init__.py
            test_symbolic_oversight.py
          )

          echo "::group::Required files"
          for f in "${required[@]}"; do
            if [ ! -f "${f}" ] && [ ! -d "${f}" ]; then
              echo "::error::Required file or directory missing: ${f}"
              exit 1
            fi
            echo "  ✓ ${f}"
          done
          echo "::endgroup::"

      # ═══════════════════════════════════════════════════════════════════
      # 7. Set up Docker Buildx
      # ═══════════════════════════════════════════════════════════════════
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      # ═══════════════════════════════════════════════════════════════════
      # 8. Build image (loaded into daemon — verify BEFORE login/push)
      # ═══════════════════════════════════════════════════════════════════
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ steps.agentbeats.outputs.version }}
            ENHANCEMENTS_ENABLED=${{ github.event.inputs.enhancements_enabled || 'true' }}
          tags: |
            ${{ steps.tags.outputs.primary }}
            green-agent:build-verify
          cache-from: type=gha,scope=build-push
          cache-to: type=gha,mode=max,scope=build-push

      # ═══════════════════════════════════════════════════════════════════
      # 9. Verify image — non-root + imports + agentbeats.json baked in
      # ═══════════════════════════════════════════════════════════════════
      - name: Verify image
        shell: bash
        run: |
          set -euo pipefail

          VERIFY_TAG="green-agent:build-verify"

          # 9a. Non-root user
          echo "::group::Non-root user"
          uid=$(docker run --rm "${VERIFY_TAG}" id -u)
          if [ "${uid}" = "0" ]; then
            echo "::error::Image runs as root (uid=0)"
            exit 1
          fi
          echo "  ✓ Runs as uid=${uid}"
          echo "::endgroup::"

          # 9b. Core imports
          echo "::group::Core imports"
          docker run --rm "${VERIFY_TAG}" python -c "
          import src
          from src.symbolic.symbolic_reasoning_engine import SymbolicReasoningEngine
          from src.policy.policy_feedback import PolicyFeedback
          from src.enhancements.schemas.node_descriptor import NodeDescriptor
          from src.enhancements.schemas.workload_descriptor import WorkloadDescriptor
          print('  ✓ all core imports OK')
          "
          echo "::endgroup::"

          # 9c. Entrypoint module importable
          echo "::group::Entrypoint module"
          docker run --rm "${VERIFY_TAG}" python -c "
          import importlib.util
          spec = importlib.util.find_spec('run_agent')
          assert spec is not None, 'run_agent.py not importable'
          print('  ✓ run_agent module found')
          "
          docker run --rm "${VERIFY_TAG}" python run_agent.py --help >/dev/null
          echo "::endgroup::"

          # 9d. agentbeats.json baked in
          echo "::group::agentbeats.json baked in"
          docker run --rm "${VERIFY_TAG}" test -f agentbeats.json
          echo "  ✓ agentbeats.json present in image"
          echo "::endgroup::"

          echo "✓ Image verified"

      # ═══════════════════════════════════════════════════════════════════
      # 10. Run symbolic test suite (advisory — does not block push)
      # ═══════════════════════════════════════════════════════════════════
      - name: Run symbolic test suite (advisory)
        continue-on-error: true
        shell: bash
        run: |
          echo "Running test_symbolic_oversight.py inside the image…"
          docker run --rm green-agent:build-verify python test_symbolic_oversight.py || {
            echo "::warning::Some tests failed — see logs. Not blocking the push."
            echo "The image is still usable; fix the failing rules in a follow-up."
          }

      # ═══════════════════════════════════════════════════════════════════
      # 11. Upload agentbeats.json as a verification artifact
      # ═══════════════════════════════════════════════════════════════════
      - name: Upload agentbeats.json
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentbeats-${{ steps.agentbeats.outputs.version || 'unknown' }}
          path: |
            agentbeats.json
          retention-days: 90
          overwrite: true
          if-no-files-found: error
          compression-level: 6

      # ═══════════════════════════════════════════════════════════════════
      # 12. Job summary
      # ═══════════════════════════════════════════════════════════════════
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          PRIMARY="${{ steps.tags.outputs.primary || 'n/a' }}"
          SHA_TAG="${{ steps.tags.outputs.sha_tag || 'n/a' }}"
          AB_IMAGE="${{ steps.agentbeats.outputs.image || 'n/a' }}"
          AB_VERSION="${{ steps.agentbeats.outputs.version || 'n/a' }}"
          DIGEST="not-published (manual verification workflow)"
          TRIGGER="${{ github.event_name }}"
          REF="${{ github.ref_name }}"
          SHA="${GITHUB_SHA:0:7}"

          {
            echo "## Green Agent — Manual Build Verification"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | \`${TRIGGER}\` |"
            echo "| Ref | \`${REF}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo "| Primary image | \`${PRIMARY}\` |"
            echo "| SHA-pinned tag | \`${SHA_TAG}\` |"
            echo "| agentbeats.json .image | \`${AB_IMAGE}\` |"
            echo "| agentbeats.json .version | \`${AB_VERSION}\` |"
            echo "| Registry status | \`${DIGEST}\` |"
            echo ""
            echo "> This workflow verifies the image locally. Automated publishing is handled by \`build-docker.yaml\`."
            echo ""
            echo "### Required \`agentbeats.json\` shape"
            echo '```json'
            echo '{'
            echo '  "name": "green-agent",'
            echo '  "version": "5.0.0",'
            echo '  "image": "ghcr.io/nurcholishadam/green-agent:5.0.0",'
            echo '  "entrypoint": ["python", "run_agent.py"],'
            echo '  "description": "Green Agent v5.0.0 — 4-layer feedback architecture"'
            echo '}'
            echo '```'
            echo ""
            echo "### Notes"
            echo "- Image name is canonical \`green-agent\` (hyphen), matching Dockerfile + manifests."
            echo "- Mutable tags (\`:latest\`, \`:main\`) are only emitted on \`main\`; AgentBeats submissions should reference \`:5.0.0\` or \`:sha-<hash>\`."
            echo "- The previous \`docker-build.yml\` was deleted — it used the non-existent \`toLower()\` expression function."
          } >> "$GITHUB_STEP_SUMMARY"

      # ═══════════════════════════════════════════════════════════════════
      # 15. Cleanup local images (frees runner disk)
      # ═══════════════════════════════════════════════════════════════════
      - name: Cleanup local images
        if: always()
        shell: bash
        run: |
          set +e
          echo "::group::Cleanup"
          docker rmi "${{ steps.tags.outputs.primary }}" 2>/dev/null || true
          docker rmi green-agent:build-verify 2>/dev/null || true
          echo "::endgroup::"

  # ═══════════════════════════════════════════════════════════════════════
  # Optional: sign the image with cosign (uncomment + add permissions)
  # ═══════════════════════════════════════════════════════════════════════
  # sign:
  #   name: Sign image with cosign
  #   needs: build
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     packages: write
  #     id-token: write       # for keyless signing via OIDC
  #   steps:
  #     - name: Install cosign
  #       uses: sigstore/cosign-installer@v3
  #       with:
  #         cosign-release: 'v2.4.0'
  #     - name: Sign
  #       env:
  #         DIGEST: ${{ needs.build.outputs.digest }}
  #       run: |
  #         cosign sign --yes "${DIGEST}"
