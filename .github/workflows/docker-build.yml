# .github/workflows/docker-build.yml
#
# Green Agent â€” Build, Verify & Push to GHCR
# ==========================================
#
# Standalone Green Agent CI workflow.
# No AgentBeats configuration or event integration.

name: Build & Push Green Agent (GHCR)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify only; do not push to GHCR'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_IMAGE: python:3.12.3-slim
  IMAGE_NAME: ghcr.io/nurcholishadam/green-agent

jobs:
  docker:
    name: Build Â· Verify Â· Push
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compute version and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          SHA_SHORT="${GITHUB_SHA:0:7}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${SHA_SHORT}"
          fi

          TAGS="${IMAGE_NAME}:${VERSION}"
          TAGS="${TAGS}"$'\n'"${IMAGE_NAME}:sha-${SHA_SHORT}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            TAGS="${TAGS}"$'\n'"${IMAGE_NAME}:latest"
          fi

          PRIMARY_TAG="${IMAGE_NAME}:${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "primary=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Green Agent version: ${VERSION}"
          echo "Primary image tag: ${PRIMARY_TAG}"
          echo ""
          echo "Tags:"
          echo "${TAGS}" | sed 's/^/  - /'

      - name: Guard required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            Dockerfile
            requirements.txt
            run_agent.py
            symbolic_policy.yaml
          )

          for path in "${required[@]}"; do
            if [[ ! -e "${path}" ]]; then
              echo "::error::Required path missing: ${path}"
              exit 1
            fi
            echo "âœ“ ${path}"
          done

          echo "âœ“ Core Green files present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            ENHANCEMENTS_ENABLED=true
          tags: |
            ${{ steps.meta.outputs.primary }}
            green-agent:build-verify
          cache-from: type=gha,scope=green-agent-docker-build
          cache-to: type=gha,mode=max,scope=green-agent-docker-build

      - name: Verify image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="green-agent:build-verify"

          echo "â–¶ Verifying non-root runtime"
          uid="$(docker run --rm "${IMAGE}" id -u)"

          if [[ "${uid}" == "0" ]]; then
            echo "::error::Container runs as root (uid=0)"
            exit 1
          fi

          echo "âœ“ Container runs as non-root (uid=${uid})"

          echo "â–¶ Verifying entrypoint module"
          docker run --rm "${IMAGE}" python - <<'PY'
          import importlib.util

          spec = importlib.util.find_spec("run_agent")
          assert spec is not None, "run_agent.py is not importable"

          print("âœ“ run_agent module found")
          PY

          echo "âœ“ Green image verified"

      - name: Run test suite
        continue-on-error: true
        shell: bash
        run: |
          echo "â–¶ Running test suite inside the image"
          docker run --rm green-agent:build-verify python test_symbolic_oversight.py || {
            echo "::warning::One or more tests failed. See logs above."
          }

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.event.inputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: github.event_name == 'push' && github.event.inputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail

          PRIMARY="${{ steps.meta.outputs.primary }}"

          echo "â–¶ Pushing Green Agent image tags"

          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue

            docker tag "${PRIMARY}" "${tag}"
            docker push "${tag}"
            echo "âœ“ Pushed ${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"

          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "${PRIMARY}")"

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "âœ“ Published digest: ${DIGEST}"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version || 'unknown' }}"
          PRIMARY="${{ steps.meta.outputs.primary || 'not-built' }}"
          DIGEST="${{ steps.push.outputs.digest || 'not-pushed' }}"

          {
            echo "## Green Agent build summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | `${{ github.event_name }}` |"
            echo "| Ref | `${{ github.ref_name }}` |"
            echo "| Commit | `${GITHUB_SHA:0:7}` |"
            echo "| Version | `${VERSION}` |"
            echo "| Primary image | `${PRIMARY}` |"
            echo "| Published digest | `${DIGEST}` |"
            echo ""

            if [[ "${DIGEST}" != "not-pushed" ]]; then
              echo "### Pull by digest"
              echo '```bash'
              echo "docker pull ${DIGEST}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up local images
        if: always()
        shell: bash
        run: |
          set +e

          docker rmi "${{ steps.meta.outputs.primary }}" 2>/dev/null || true
          docker rmi green-agent:build-verify 2>/dev/null || true

