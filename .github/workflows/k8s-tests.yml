# .github/workflows/k8s-tests.yml
#
# Green Agent — Kubernetes Integration Tests
# ==========================================
#
# Builds the Green Agent image, loads it into Kind, deploys the development
# Kustomize overlay, diagnoses the workload, and performs a smoke test.

name: Kubernetes Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'run_agent.py'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/k8s-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/k8s-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: k8s-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_IMAGE: python:3.12.3-slim
  IMAGE_NAME: green-agent
  IMAGE_TAG: k8s-test
  KIND_CLUSTER_NAME: green-agent-test
  KUBE_NAMESPACE: green-agent-development

jobs:
  kubernetes-tests:
    name: Build · Deploy · Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            Dockerfile
            config/base/kustomization.yaml
            config/base/deployment.yaml
            config/base/service.yaml
            config/overlays/development/kustomization.yaml
          )

          for path in "${required[@]}"; do
            if [[ ! -e "${path}" ]]; then
              echo "::error::Required path missing: ${path}"
              exit 1
            fi
            echo "✓ ${path}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build Green Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=0.0.0-k8s-test
            ENHANCEMENTS_ENABLED=true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=green-agent-k8s-tests
          cache-to: type=gha,mode=max,scope=green-agent-k8s-tests

      - name: Verify image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "▶ Verifying non-root runtime"
          uid="$(docker run --rm "${IMAGE}" id -u)"

          if [[ "${uid}" == "0" ]]; then
            echo "::error::Container runs as root (uid=0)"
            exit 1
          fi

          echo "✓ Container runs as non-root (uid=${uid})"

          echo "▶ Verifying entrypoint module"
          docker run --rm "${IMAGE}" python - <<'PY'
          import importlib.util

          spec = importlib.util.find_spec("run_agent")
          assert spec is not None, "run_agent.py is not importable"

          print("✓ run_agent module found")
          PY

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s
          kubectl_version: v1.31.3

      - name: Verify Kubernetes access
        shell: bash
        run: |
          set -euo pipefail
          kubectl cluster-info
          kubectl get nodes
          kind version

      - name: Load image into Kind
        shell: bash
        run: |
          set -euo pipefail

          kind load docker-image \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --name "${KIND_CLUSTER_NAME}"

          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Loaded image: {{.RepoTags}}'

      - name: Create namespace
        shell: bash
        run: |
          set -euo pipefail

          if kubectl get namespace "${KUBE_NAMESPACE}" >/dev/null 2>&1; then
            echo "✓ Namespace already exists"
          else
            kubectl create namespace "${KUBE_NAMESPACE}"
          fi

      - name: Deploy development overlay
        shell: bash
        run: |
          set -euo pipefail

          echo "▶ Rendered Kubernetes resources"
          kubectl kustomize config/overlays/development

          echo "▶ Applying development overlay"
          kubectl apply -k config/overlays/development -n "${KUBE_NAMESPACE}"

          kubectl get all -n "${KUBE_NAMESPACE}" -o wide

      - name: Diagnose deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "▶ Initial deployment status"
          kubectl get deployment green-agent -n "${KUBE_NAMESPACE}" -o wide || true
          kubectl get pods -n "${KUBE_NAMESPACE}" -o wide || true

          echo "▶ Deployment description"
          kubectl describe deployment green-agent -n "${KUBE_NAMESPACE}" || true

          echo "▶ Pod description"
          kubectl describe pods \
            -l app.kubernetes.io/name=green-agent \
            -n "${KUBE_NAMESPACE}" || true

          echo "▶ Kubernetes events"
          kubectl get events -n "${KUBE_NAMESPACE}" \
            --sort-by=.lastTimestamp || true

          echo "▶ Container logs"
          kubectl logs \
            -l app.kubernetes.io/name=green-agent \
            --all-containers \
            --prefix \
            --tail=200 \
            -n "${KUBE_NAMESPACE}" || true

      - name: Wait for deployment
        shell: bash
        run: |
          set -euo pipefail

          echo "▶ Waiting up to 180 seconds for Green Agent deployment"

          if ! kubectl rollout status \
            deployment/green-agent \
            --namespace="${KUBE_NAMESPACE}" \
            --timeout=180s; then

            echo "::error::Green Agent deployment did not become available"

            echo "▶ Final pod status"
            kubectl get pods -n "${KUBE_NAMESPACE}" -o wide || true

            echo "▶ Final pod description"
            kubectl describe pods \
              -l app.kubernetes.io/name=green-agent \
              -n "${KUBE_NAMESPACE}" || true

            echo "▶ Final events"
            kubectl get events -n "${KUBE_NAMESPACE}" \
              --sort-by=.lastTimestamp || true

            echo "▶ Final container logs"
            kubectl logs \
              -l app.kubernetes.io/name=green-agent \
              --all-containers \
              --prefix \
              --tail=300 \
              -n "${KUBE_NAMESPACE}" || true

            exit 1
          fi

      - name: Run smoke test
        shell: bash
        run: |
          set -euo pipefail

          echo "▶ Kubernetes smoke test"

          kubectl get deployment green-agent -n "${KUBE_NAMESPACE}" -o wide
          kubectl get pods -n "${KUBE_NAMESPACE}" -o wide
          kubectl get service green-agent -n "${KUBE_NAMESPACE}" -o wide

          POD="$(kubectl get pods \
            -l app.kubernetes.io/name=green-agent \
            -n "${KUBE_NAMESPACE}" \
            -o jsonpath='{.items[0].metadata.name}')"

          echo "▶ Testing Green Agent inside the cluster"
          kubectl exec -n "${KUBE_NAMESPACE}" "${POD}" -- \
            python -c "import run_agent; print('Green Agent import OK')"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Green Agent Kubernetes test summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | `${{ github.event_name }}` |"
            echo "| Ref | `${{ github.ref_name }}` |"
            echo "| Commit | `${GITHUB_SHA:0:7}` |"
            echo "| Kind cluster | `${KIND_CLUSTER_NAME}` |"
            echo "| Namespace | `${KUBE_NAMESPACE}` |"
            echo "| Image | `${IMAGE_NAME}:${IMAGE_TAG}` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete Kind cluster
        if: always()
        shell: bash
        run: |
          set +e
          kind delete cluster --name "${KIND_CLUSTER_NAME}" || true
