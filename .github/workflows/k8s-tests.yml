# .github/workflows/k8s-tests.yml
#
# Green Agent — Kubernetes Integration Tests
# ==========================================
#
# Builds the Green Agent image, loads it into a Kind cluster, deploys the
# development Kustomize overlay, and performs a basic smoke test.
#
# This workflow is AgentBeats-free.

name: Kubernetes Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'run_agent.py'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/k8s-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'requirements*.txt'
      - 'run_agent.py'
      - 'src/**'
      - 'config/**'
      - '.github/workflows/k8s-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: k8s-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_IMAGE: python:3.12.3-slim
  IMAGE_NAME: green-agent
  IMAGE_TAG: k8s-test
  KIND_CLUSTER_NAME: green-agent-test
  KUBE_NAMESPACE: green-agent-development

jobs:
  kubernetes-tests:
    name: Build · Deploy · Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Guard required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            Dockerfile
            config/overlays/development/kustomization.yaml
          )

          for path in "${required[@]}"; do
            if [[ ! -e "${path}" ]]; then
              echo "::error::Required path missing: ${path}"
              exit 1
            fi
            echo "✓ ${path}"
          done

          echo "✓ Required Kubernetes test files present"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build Green Agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          provenance: false
          sbom: false
          build-args: |
            PYTHON_IMAGE=${{ env.PYTHON_IMAGE }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.run_started_at }}
            VCS_REF=${{ github.sha }}
            BUILD_VERSION=0.0.0-k8s-test
            ENHANCEMENTS_ENABLED=true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=green-agent-k8s-tests
          cache-to: type=gha,mode=max,scope=green-agent-k8s-tests

      - name: Verify image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          echo "▶ Verifying non-root runtime"
          uid="$(docker run --rm "${IMAGE}" id -u)"

          if [[ "${uid}" == "0" ]]; then
            echo "::error::Container runs as root (uid=0)"
            exit 1
          fi

          echo "✓ Container runs as non-root (uid=${uid})"

          echo "▶ Verifying entrypoint module"
          docker run --rm "${IMAGE}" python - <<'PY'
          import importlib.util

          spec = importlib.util.find_spec("run_agent")
          assert spec is not None, "run_agent.py is not importable"

          print("✓ run_agent module found")
          PY

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s
          kubectl_version: v1.31.3

      - name: Verify Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          kubectl cluster-info
          kubectl get nodes
          kind version

      - name: Load image into Kind
        shell: bash
        run: |
          set -euo pipefail

          kind load docker-image \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            --name "${KIND_CLUSTER_NAME}"

          docker image inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
            --format 'Loaded image: {{.RepoTags}}'

      - name: Create namespace
        shell: bash
        run: |
          set -euo pipefail

          if kubectl get namespace "${KUBE_NAMESPACE}" >/dev/null 2>&1; then
            echo "✓ Namespace ${KUBE_NAMESPACE} already exists"
          else
            kubectl create namespace "${KUBE_NAMESPACE}"
            echo "✓ Created namespace ${KUBE_NAMESPACE}"
          fi

      - name: Deploy development overlay
        shell: bash
        run: |
          set -euo pipefail

          echo "▶ Applying development Kustomize overlay"
          kubectl apply -k config/overlays/development -n "${KUBE_NAMESPACE}"

          echo "▶ Kubernetes resources"
          kubectl get all -n "${KUBE_NAMESPACE}" -o wide

      - name: Wait for deployments
        shell: bash
        run: |
          set -euo pipefail

          echo "▶ Waiting for deployments in ${KUBE_NAMESPACE}"

          if ! kubectl get deployments -n "${KUBE_NAMESPACE}" --no-headers 2>/dev/null | grep -q .; then
            echo "::warning::No Deployment resources were created by the development overlay."
            echo "Skipping deployment wait; continuing with namespace-level smoke test."
            exit 0
          fi

          kubectl wait \
            --for=condition=available \
            --timeout=300s \
            deployment --all \
            -n "${KUBE_NAMESPACE}"

          kubectl get deployments -n "${KUBE_NAMESPACE}"

      - name: Run smoke test
        shell: bash
        run: |
          set -euo pipefail

          echo "▶ Kubernetes smoke test"

          if kubectl get deployments -n "${KUBE_NAMESPACE}" --no-headers 2>/dev/null | grep -q .; then
            kubectl get pods -n "${KUBE_NAMESPACE}" -o wide
            kubectl get services -n "${KUBE_NAMESPACE}" -o wide
          else
            echo "::warning::No Deployment resources found; Kubernetes smoke test is limited to namespace validation."
          fi

          kubectl get namespace "${KUBE_NAMESPACE}"

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e

          echo "▶ Collecting Kubernetes diagnostics"

          kubectl get nodes -o wide || true
          kubectl get namespaces || true
          kubectl get all -n "${KUBE_NAMESPACE}" -o wide || true
          kubectl get events -n "${KUBE_NAMESPACE}" --sort-by=.lastTimestamp || true

          echo "▶ Pod logs"
          kubectl logs \
            --all-containers \
            --prefix \
            -n "${KUBE_NAMESPACE}" \
            --tail=200 || true

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Green Agent Kubernetes test summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | `${{ github.event_name }}` |"
            echo "| Ref | `${{ github.ref_name }}` |"
            echo "| Commit | `${GITHUB_SHA:0:7}` |"
            echo "| Kind cluster | `${KIND_CLUSTER_NAME}` |"
            echo "| Namespace | `${KUBE_NAMESPACE}` |"
            echo "| Image | `${IMAGE_NAME}:${IMAGE_TAG}` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete Kind cluster
        if: always()
        shell: bash
        run: |
          set +e
          kind delete cluster --name "${KIND_CLUSTER_NAME}" || true
