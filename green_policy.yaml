version: "2.0"

agent_identity:
  name: "Green-Auditor-Meta-Cognitive"
  role: "ESG_Compliance_Monitor_With_Reflection"
  mode: "active_enforcement_with_self_awareness"

constraints:
  max_energy_per_task_wh: 5.0
  max_carbon_per_task_kg: 0.002
  max_latency_seconds: 120
  memory_limit_gb: 4.0

carbon_context:
  region: "US-West-2"
  grid_intensity_g_kwh: 385.0
  pue_factor: 1.2
  use_offset_logic: false

optimization:
  priority_weight:
    accuracy: 0.6
    sustainability: 0.4
  preferred_model_tier: "SLM"
  fallback_to_expensive: false

# Meta-Cognitive Configuration
meta_cognitive:
  # Reflection frequency: agent pauses every N steps to self-reflect
  reflection_frequency: 5
  
  # Self-adjustment thresholds: trigger adaptive policy changes
  self_adjustment_thresholds:
    energy_threshold_pct: 80      # Adjust if energy > 80% of budget
    carbon_threshold_pct: 80      # Adjust if carbon > 80% of budget
    latency_threshold_pct: 80     # Adjust if latency > 80% of budget
    memory_threshold_pct: 80      # Adjust if memory > 80% of budget
  
  # Enable dynamic policy adjustments based on reflection outcomes
  adaptive_policy_enabled: true
  
  # Long-context reasoning configuration
  long_context:
    enabled: true
    history_window: 10            # Consider last 10 runs for pattern analysis
    min_confidence_threshold: 0.7 # Minimum confidence for applying insights
  
  # Sustained reflection across runs
  sustained_reflection:
    enabled: true
    memory_persistence: true
    meta_policy_generation: true
    pattern_tracking: true

# Interpretability Configuration
interpretability:
  # Generate self-explanations at reflection checkpoints
  self_explanation_enabled: true
  
  # Store structured reflection logs
  reflection_logging: true
  reflection_log_path: "reflections.json"
  
  # Dashboard and visualization
  dashboard_enabled: true
  dashboard_output: "dashboard.html"
  
  # Dual-layer feedback (objective + subjective)
  dual_layer_feedback: true

reporting:
  alert_threshold_energy_pct: 80
  output_format: "json_detailed"
  include_reflections: true
  include_patterns: true
  include_meta_policy: true

# ---------------------------------------------------------------------------
# Advanced Enhancements (LIMIT Graph, MODP, RLHF, Multi‑Teacher On‑Policy
# Distillation, Bio‑inspired Optimisation, MoE expert gating, FlexGen integration)
# ---------------------------------------------------------------------------
enhancements:
  enabled: true                # Master switch for all advanced features

  # LIMIT Graph integration
  limit_graph:
    enabled: true
    graph_metrics:
      centrality: 0.7
      connectivity: 0.6
      density: 0.5
    update_interval_seconds: 60
    influence_weight: 0.3      # How much graph metrics influence decisions

  # Multi‑Objective Decision Process (MODP)
  modp:
    enabled: true
    objective_weights: [0.4, 0.3, 0.2, 0.1]  # [accuracy, energy, latency, carbon]
    normalize_weights: true
    score_threshold_low: 0.4
    score_threshold_high: 0.7

  # Reinforcement Learning from Human Feedback (RLHF)
  rlhf:
    enabled: true
    human_feedback_score: 0.6
    collect_feedback: true
    feedback_source: "dashboard"   # dashboard | api | manual

  # Multi‑Teacher On‑Policy Distillation with MoE gating
  distillation:
    enabled: true
    use_moe_gating: true
    distillation_lr: 0.01
    gating_lr: 0.005
    replay_size: 2000
    train_every: 10
    epsilon: 0.1
    teachers:
      - "rule_based"
      - "historical_ml"
      - "q_learning"
      - "rlhf"

  # Bio‑inspired Optimisation (Evolutionary)
  bio_inspired:
    enabled: true
    use_evolutionary: true
    population_size: 20
    mutation_rate: 0.1
    crossover_rate: 0.7
    elitism: 2

  # Mixture‑of‑Experts expert gating
  moe_expert:
    enabled: true
    n_experts: 4
    gating_lr: 0.005

  # FlexGen integration (optional high‑throughput LLM execution backend)
  flexgen:
    enabled: true               # Set to true to use FlexGen as execution backend
    model_name: "facebook/opt-6.7b"
    batch_size: 16
    memory_limit_mb: 4096
    precision_options: ["fp32", "fp16", "int8"]
    default_precision: "fp16"
    delegation_policy: "adaptive"   # adaptive | always | never
