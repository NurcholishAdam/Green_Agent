# =============================================================================
# Companion files (for reference — save these separately)
# =============================================================================
#
# ─── green_agent_targets.example.yml ────────────────────────────────────
# Save as /etc/prometheus/green-agent-targets.yml to feed the
# `green-agent-file-sd` job above.
#
# The file_sd_configs refreshes every 1m, so edits here take effect
# without restarting Prometheus.
#
# - targets:
#     - "green-agent-prod-0.internal:8000"
#     - "green-agent-prod-1.internal:8000"
#   labels:
#     environment: production
#     datacenter: dc1
#     team: ai-platform
#
# - targets:
#     - "green-agent-staging-0.internal:8000"
#   labels:
#     environment: staging
#     datacenter: dc1
#     team: ai-platform
#
#
# ─── .envsubst template usage ───────────────────────────────────────────
# If you keep `prometheus.yml.tmpl` with `{{CLUSTER}}`, `{{REGION}}`, etc.
# placeholders, substitute at deploy time:
#
#     envsubst < prometheus.yml.tmpl > /etc/prometheus/prometheus.yml
#
# Then verify:
#
#     promtool check config /etc/prometheus/prometheus.yml
#     curl -s http://localhost:9090/api/v1/targets | jq '.data.activeTargets[].labels' \
#         | grep -F '{{' && echo "FAIL: template leaked" || echo "PASS"
#
#
# ─── Verification checklist ─────────────────────────────────────────────
# 1. promtool check config prometheus.yml
#    → SUCCESS: prometheus.yml is valid
#
# 2. curl -s http://localhost:9090/api/v1/targets | jq -r '
#      .data.activeTargets[] | "\(.labels.job)  up=\(.health)"' | sort -u
#    → every job above appears with up=up
#
# 3. curl -s http://localhost:9090/api/v1/rules | jq -r '.data.groups[].name'
#    → green_agent_graph_health, green_agent_slow_alerts, ...
#
# 4. curl -s http://localhost:9090/api/v1/targets | jq '.data.activeTargets[].labels' \
#      | grep -F '{{'
#    → returns nothing (no template leaked)
#
#
# ─── What changed from v1.0 — property summary ──────────────────────────
# Prior config:                          Enhanced:
#   external_labels were mustache         external_labels are literal
#   templates (stored as literal          strings; region + replica added
#   "{{ .Cluster }}")
#
#   No k8s scheme/path/ready/port         Full relabel chain (8 rules)
#   filters (HTTPS targets broke)
#
#   honor_labels: true → silent           honor_labels: false → explicit
#   job-override risk                     job label
#
#   No cardinality limits                 sample_limit, label_limit,
#                                         body_size_limit on every job
#
#   metric allowlist hid exporter         go_/process_/python_/promhttp_
#   self-metrics                          explicitly kept
#
#   No self-scrape jobs                   prometheus, alertmanager,
#                                         kube-state-metrics, node-exporter
#
#   Alertmanager single HTTP target       Alertmanager HA + TLS + v2
#
#   Static job live placeholders          Only localhost active; the rest
#   (10.0.0.50, example.com) failed       commented out with `# REPLACE:`
#
#   File-SD missing → zero targets        Fallback dummy target → visible
#   (silent)                              as up=0
#
#   No-op relabels in file-SD / Consul    Removed (they did nothing)
#
#   Header said "include via rule_files"  Header corrected: partial
#   (wrong — cannot include scrape_configs prometheus.yml
#   via rule_files)
#
#   Commented remote-write template       Hardened example with
#   without write relabeling              write_relabel_configs,
#                                         metadata_config, tuned queue
# =============================================================================
