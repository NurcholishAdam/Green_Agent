# prometheus.yml — Green Agent Scrape Configuration (Enhanced)
# Add this to your main prometheus.yml or include via rule_files

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: '{{ .Cluster }}'
    environment: '{{ .Environment }}'

# ---------------------------------------------------------------------------
# Scrape Configurations for Green Agent (including advanced enhancements)
# ---------------------------------------------------------------------------

scrape_configs:

  # -----------------------------------------------------------------------
  # Option 1: Kubernetes Service Discovery (Production)
  # -----------------------------------------------------------------------
  - job_name: 'green-agent'
    honor_labels: true
    honor_timestamps: true
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    
    kubernetes_sd_configs:
    - role: endpoints
      namespaces:
        names:
        - green-agent-production
        - green-agent-staging
        - green-agent-dev
    
    relabel_configs:
    - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
      action: keep
      regex: true
    - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
      action: replace
      target_label: __metrics_port__
      regex: (\d+)
    - source_labels: [__address__, __metrics_port__]
      action: replace
      regex: ([^:]+)(?::\d+)?;(\d+)
      replacement: $1:$2
      target_label: __address__
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: kubernetes_namespace
    - source_labels: [__meta_kubernetes_pod_name]
      action: replace
      target_label: pod
    - source_labels: [__meta_kubernetes_pod_node_name]
      action: replace
      target_label: node
    - source_labels: [__meta_kubernetes_pod_label_app]
      action: replace
      target_label: app
    - source_labels: [__meta_kubernetes_pod_label_component]
      action: replace
      target_label: component
    - source_labels: [__meta_kubernetes_namespace]
      action: replace
      target_label: environment
      regex: green-agent-(.*)
      replacement: $1
    
    metric_relabel_configs:
    # Keep only Green Agent specific metrics to reduce cardinality
    - source_labels: [__name__]
      regex: 'green_agent_.*'
      action: keep
    # Drop extremely high cardinality edge weight metrics if necessary (already limited by exporter)
    - source_labels: [__name__]
      regex: 'green_agent_moe_gate_weight'
      action: keep   # keep MoE gate weights if we need them (can be high cardinality; adjust as needed)
    - target_label: job
      replacement: green-agent

  # -----------------------------------------------------------------------
  # Option 2: Static Config (Local Development / Bare Metal)
  # -----------------------------------------------------------------------
  - job_name: 'green-agent-static'
    honor_labels: true
    scrape_interval: 15s
    scrape_timeout: 5s
    metrics_path: /metrics
    scheme: http
    
    static_configs:
    - targets:
      - 'localhost:8000'
      - 'green-agent-dev.example.com:8000'
      - '10.0.0.50:8000'
      labels:
        environment: development
        team: ai-platform
    
    metric_relabel_configs:
    - source_labels: [__name__]
      regex: 'process_.*'
      action: drop
    - source_labels: [__name__]
      regex: 'green_agent_.*'
      action: keep

  # -----------------------------------------------------------------------
  # Option 3: File-Based Service Discovery (Hybrid Deployments)
  # -----------------------------------------------------------------------
  - job_name: 'green-agent-file-sd'
    honor_labels: true
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    
    file_sd_configs:
    - files:
      - '/etc/prometheus/green-agent-targets.yml'
      refresh_interval: 1m
    
    relabel_configs:
    - source_labels: [environment]
      action: replace
      target_label: environment
    - source_labels: [datacenter]
      action: replace
      target_label: datacenter
    
    metric_relabel_configs:
    - source_labels: [__name__]
      regex: 'green_agent_.*'
      action: keep

  # -----------------------------------------------------------------------
  # Option 4: Consul Service Discovery (If Using Consul)
  # -----------------------------------------------------------------------
  - job_name: 'green-agent-consul'
    honor_labels: true
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics
    scheme: http
    
    consul_sd_configs:
    - server: 'consul.example.com:8500'
      services: ['green-agent']
      tags: ['metrics']
    
    relabel_configs:
    - source_labels: [__meta_consul_service]
      action: replace
      target_label: service
    - source_labels: [__meta_consul_tags]
      action: replace
      target_label: tags
      regex: '(.*)'
      replacement: '$1'
    
    metric_relabel_configs:
    - source_labels: [__name__]
      regex: 'green_agent_.*'
      action: keep

# ---------------------------------------------------------------------------
# Alerting Configuration (if using Alertmanager)
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - 'alertmanager.example.com:9093'
    scheme: http
    timeout: 10s

# ---------------------------------------------------------------------------
# Rule Files (include Green Agent alerts and enhanced alerts)
# ---------------------------------------------------------------------------
rule_files:
  - 'rules/green_agent_alerts.yml'
  - 'rules/green_agent_recording.yml'
  # Enhanced alerts for advanced modules (LIMIT Graph, MODP, RLHF, etc.)
  - 'rules/enhanced_alerts.yml'
  # Optional: recording rules for MODP, RLHF, graph metrics
  - 'rules/enhanced_recording.yml'

